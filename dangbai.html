<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch Đăng Bài</title>
<style>
:root{--nen:#f6f8fa;--the:#fff;--chu:#14202e;--mo:#566373;--vien:#e3e8ee;--vien-dam:#cbd3dc;--to:#eef2f6;
--chinh:#0f62b5;--chinh-nhat:#e9f2fb;--chinh-vua:#cfe2f5;--chinh-dam:#0a3f75;
--xanh:#1b7a4b;--xanh-nhat:#def5e7;--do:#c4242a;--do-nhat:#ffecea;--cam:#92500e;--cam-nhat:#fff4dd;--xam-nhat:#eef2f6;
--r:8px;--r2:6px;--gap:20px;--ben:232px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:14px/1.5 "Google Sans","Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--chinh);outline-offset:1px}
.khung{display:grid;grid-template-columns:var(--ben) minmax(0,1fr);min-height:100vh}
.ben{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 12px;border-right:1px solid var(--vien)}
.thuong{display:flex;gap:10px;align-items:center;padding:0 8px}
.thuong svg{flex:none}
.thuong b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.thuong span{display:block;font-size:12px;color:var(--mo)}
#nutMenu{display:none}
nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;border:0;border-radius:var(--r2);background:none;padding:6px 10px;text-align:left;cursor:pointer;color:var(--mo);font-weight:500;transition:background-color .12s}
nav button:hover{background:var(--to);color:var(--chu)}
nav button.on{background:var(--chinh-nhat);color:var(--chinh-dam)}
nav button.on svg{color:var(--chinh)}
nav svg{flex:none}
.ban{padding:0 8px;margin:0}
.ban select{height:38px;background:var(--the)}
.vung{min-width:0;padding:32px 32px 56px}
.dau{margin-bottom:20px}
.dau h1{font-size:26px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em}
.dau p{margin:4px 0 0;color:var(--mo)}
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--r);padding:20px;margin-bottom:var(--gap)}
.the h2{font-size:16px;font-weight:700;margin:0 0 12px}
.demo{background:var(--cam-nhat);color:var(--cam);border-radius:var(--r2);padding:8px 12px;font-size:13px;margin-bottom:16px}
.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gian{justify-content:space-between}
.nut{border:1px solid var(--vien-dam);background:var(--the);border-radius:var(--r2);padding:6px 12px;cursor:pointer;font-weight:500;min-height:36px;transition:background-color .12s,transform .08s}
.nut:hover{background:var(--to)}
.nut:active{transform:scale(.98)}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.chinh:hover{background:var(--chinh-dam);border-color:var(--chinh-dam)}
.nut.do{color:var(--do);border-color:#eec6c6}
.nut:disabled{opacity:.55;cursor:wait}
label{display:block;font-size:13px;color:var(--mo);font-weight:500;margin-bottom:12px}
label input:not([type=checkbox]),label select,label textarea,.ban select{display:block;width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--vien-dam);border-radius:var(--r2);background:var(--the);color:var(--chu);font-weight:400;font-size:14px}
input[readonly]{background:var(--to)!important}
input[type=checkbox]{accent-color:var(--chinh);width:16px;height:16px}
textarea{min-height:120px;resize:vertical}
label.chon{display:flex;gap:7px;align-items:center;color:var(--chu);margin:0 12px 8px 0;font-weight:400;font-size:14px}
.luoi2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 16px}
.so{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));background:var(--the);border:1px solid var(--vien);border-radius:var(--r);margin-bottom:var(--gap);overflow:hidden}
.so div{padding:14px 20px;border-left:1px solid var(--vien);margin-left:-1px}
.so b{display:block;font-size:24px;font-weight:700;line-height:1.25}
.so span{font-size:13px;color:var(--mo)}
.homnay-khoi{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(190px,1fr);gap:var(--gap);margin-bottom:var(--gap)}
.homnay-khoi .the{margin:0}
.ba-gio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gio-the{display:block;width:100%;text-align:left;font:inherit;border:1px solid var(--vien);background:var(--the);border-radius:var(--r2);padding:12px;transition:background-color .12s}
button.gio-the{cursor:pointer}button.gio-the:hover{background:var(--to)}
.gio-the>b{display:block;font-size:22px;font-weight:700;line-height:1.2;margin-bottom:8px}
.nguoi{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:8px}
.nguoi span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dem-doc{display:flex;flex-direction:column;justify-content:center;padding:4px 20px!important}
.dem-doc div{padding:12px 0}
.dem-doc div+div{border-top:1px solid var(--vien)}
.dem-doc b{display:block;font-size:24px;font-weight:700;line-height:1.25}
.dem-doc span{font-size:13px;color:var(--mo)}
.thang{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--vien);border:1px solid var(--vien);border-radius:var(--r2);overflow:hidden}
.ngay{background:var(--the);min-height:112px;padding:8px 6px;min-width:0;border-top:2px solid transparent}
.ngay.cuoi-tuan{background:#fafbfc}
.ngay.ngoai{background:var(--nen)}
.ngay .so-ngay{font-size:13px;font-weight:500;color:var(--mo);margin:0 4px 6px;white-space:nowrap}
.ngay.homnay{border-top-color:var(--chinh)}
.ngay.homnay .so-ngay{color:var(--chinh-dam);font-weight:700}
.chip,.otrong{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;border:0;border-radius:4px;padding:3px 6px;margin-bottom:2px;font-size:13px;line-height:1.45;text-align:left;white-space:nowrap}
.chip{cursor:pointer;transition:filter .12s}
.chip:hover{filter:brightness(.96)}
.chip span,.otrong{overflow:hidden;text-overflow:ellipsis}
.chip b{flex:none;font-weight:700}
.chip.cua-toi{font-weight:700;box-shadow:inset 3px 0 0 currentColor}
.gio-the.cua-toi{border-color:var(--chinh);box-shadow:inset 3px 0 0 var(--chinh)}
.chi-dt{display:none}
.otrong{background:none;color:#6b7684;box-shadow:inset 0 0 0 1px var(--vien)}
button.otrong{cursor:pointer}
button.otrong:hover{background:var(--to)}
.ghichu{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mo);margin-top:12px}
.ghichu span{display:inline-flex;gap:5px;align-items:center}.ghichu i{font-style:normal}
.s-cho{background:var(--chinh-nhat);color:var(--chinh-dam)}.s-tao{background:var(--chinh-vua);color:var(--chinh-dam)}.s-xong{background:var(--xanh-nhat);color:#14532d}.s-tre{background:var(--do-nhat);color:#831c1e}.s-loi{background:var(--do);color:#fff}.s-dang{background:var(--cam-nhat);color:var(--cam)}
.nhan{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.dong{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--vien);cursor:pointer}
.dong:first-of-type{border-top:0}
.dong b{font-weight:500}
.dong small{color:var(--mo);display:block;font-size:13px}
.trong{color:var(--mo);padding:20px 0;text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-top:1px solid var(--vien);text-align:left;font-size:14px}
th{color:var(--mo);font-size:12px;font-weight:500;border-top:0;padding-top:0}
td.so-p,th.so-p{text-align:right}
.cuon-bang{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hop-dau{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 12px 6px 20px}
.hop-dau h3{margin:8px 0 0!important}
.nut-x{flex:none;width:44px;height:44px;border:0;border-radius:var(--r2);background:none;cursor:pointer;font-size:24px;line-height:1;color:var(--mo)}
.nut-x:hover{background:var(--to)}
.hop-than{flex:1;min-height:0;overflow:auto;padding:6px 20px 12px}
.hop-cuoi{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-top:1px solid var(--vien)}
details.phu{border:1px solid var(--vien);border-radius:var(--r2);padding:0 12px;margin-bottom:12px}
details.phu summary{display:flex;align-items:center;min-height:44px;cursor:pointer;font-weight:500}
details.phu[open]{padding-bottom:12px}
details.phu summary::-webkit-details-marker{display:none}
details.phu summary{justify-content:space-between;list-style:none}
details.phu summary::after{content:"+";font-size:20px;color:var(--mo)}
details.phu[open] summary::after{content:"\2212"}
.nut.rong{width:100%}
.lop{position:fixed;inset:0;background:rgba(15,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.hop{display:flex;flex-direction:column;max-height:calc(100vh - 48px);background:var(--the);border-radius:12px;width:100%;max-width:560px;box-shadow:0 16px 40px rgba(15,25,35,.22)}
.hop h3{margin:0 0 12px;font-size:18px;font-weight:700}
.nd{white-space:pre-wrap;background:var(--to);border-radius:var(--r2);padding:10px 12px;font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14202e;color:#fff;padding:9px 15px;border-radius:var(--r2);z-index:30;max-width:92vw;display:none;box-shadow:0 8px 24px rgba(15,25,35,.25)}
ol.hd{margin:0;padding-left:20px;font-size:14px}ol.hd li{margin-bottom:6px}
a{color:var(--chinh)}
@media(max-width:1100px){
 .khung{display:block}
 .ben{position:sticky;z-index:10;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 16px;background:var(--the);border-right:0;border-bottom:1px solid var(--vien)}
 .thuong{padding:0;margin-right:auto}
 .thuong span{display:none}
 .ban{padding:0;order:1;margin:0;font-size:0}.ban select{margin:0;max-width:150px;height:36px}
 #nutMenu{display:inline-flex;align-items:center;justify-content:center;order:2;width:44px;height:44px;border:0;background:none;cursor:pointer}
 nav{display:none;order:3;flex:0 0 100%;padding:6px 0}
 .mo-menu nav{display:flex}
 nav button{min-height:44px}
 .vung{padding:20px 16px 40px}
}
@media(max-width:820px){
 .homnay-khoi{grid-template-columns:minmax(0,1fr)}
 .dem-doc{flex-direction:row;padding:0 20px!important}
 .dem-doc div{flex:1;padding:12px 0}
 .dem-doc div+div{border-top:0;padding-left:16px}
 .thang{display:block;border:0;background:none}
 .chi-dt{display:block}
 .nut{min-height:44px}
 .nut[aria-label]{min-width:44px}
 input:not([type=checkbox]),select,textarea{font-size:16px!important;min-height:44px}
 input[type=checkbox]{width:22px;height:22px}
 label.chon{min-height:44px;margin-bottom:0}
 .ban select{height:44px}
 .chip,.otrong{min-height:44px}
 .nut.nut-cu{width:100%;margin-bottom:8px}
 .thang:not(.hien-cu) .ngay.da-qua,.ngay.khong-bai{display:none}
 .ngay.ngoai{display:none}
 .ngay{min-height:0;border:1px solid var(--vien);border-radius:var(--r2);margin-bottom:8px;padding:10px}
 .ngay.homnay{border-color:var(--chinh)}
 .ngay .so-ngay{font-size:14px}
 .chip,.otrong{font-size:14px;padding:8px;margin-bottom:4px}
}
@media(max-width:560px){
 .ba-gio{grid-template-columns:minmax(0,1fr)}
 .gio-the{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px}
 .gio-the>b{font-size:16px;margin:0}.nguoi{margin:0}
 .so{grid-template-columns:repeat(2,minmax(0,1fr))}
 th,td{padding:8px 5px}
 td .nguoi span:last-child{white-space:normal;overflow-wrap:anywhere}
 .so div:last-child:nth-child(odd){grid-column:1/-1}
}
 @media(max-width:560px){
 .lop{padding:0}
 .hop{max-width:none;min-height:100vh;min-height:100dvh;max-height:100vh;max-height:100dvh;border-radius:0}
 .hop-cuoi{padding-bottom:max(12px,env(safe-area-inset-bottom))}
 .hop-cuoi .nut{flex:1}
 .gio-the{min-height:44px}
}
@media(max-width:400px){
 .thuong b{display:none}
 .thuong{margin-right:0}
 .ban{flex:1;min-width:0}
 .ban select{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbzaIm8pj8TKSzdbmXsbPXYGlsR8FgQ8FIfz9cYE_ibJPfS2ChvxVXjdoQiYy88GZWFV/exec';

const TEN_THU=['T2','T3','T4','T5','T6','T7','CN'];

const GIO_MAC_DINH=['08:00','12:00','18:00'];
const TT_NHAN={cho:'Chưa đăng',tao:'Đã tạo bài',xong:'Đã đăng',tre:'Quá giờ',loi:'Lỗi',dang:'Đang đăng'};
let db={nhanVien:[],baiDang:[],chuDe:[],nhom:[],dangNhom:[],khungGio:[]}, tab='lich', pin='', ketNoi=null, kbTab='nv', moNhom={}, tatCaNhom=false;
let thang=new Date(); thang.setDate(1);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nho={get(k){try{return localStorage.getItem(k)}catch(e){return nho.m[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){nho.m[k]=v}},m:{}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dmy=s=>s?s.split('-').reverse().join('/'):'';
const homNay=()=>ymd(new Date());
const tenNV=id=>(db.nhanVien.find(n=>n.id===id)||{}).ten||'Chưa phân';
const thoiGian=b=>new Date(b.ngay+'T'+(b.gio||'00:00')+':00');
const sapXep=(a,b)=>(a.ngay+a.gio).localeCompare(b.ngay+b.gio);
const linkAnToan=u=>/^https?:\/\//i.test(u||'')?u:'';
function tt(b){if(b.trangThai==='Đã đăng')return'xong';if(b.trangThai==='Lỗi')return'loi';if(b.trangThai==='Đang đăng')return'dang';return thoiGian(b)<new Date()?'tre':(b.noiDung?'tao':'cho')}
const gioDS=()=>{const g=(db.khungGio||[]).map(x=>x.ten).filter(Boolean).sort();return g.length?g:GIO_MAC_DINH};
const gioNay=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const thuNgay=k=>{const d=new Date(k+'T00:00:00');return`${TEN_THU_DU[(d.getDay()+6)%7]} - ${d.getDate()}/${d.getMonth()+1}`};
function avatar(id,ten){const i=db.nhanVien.findIndex(n=>n.id===id),h=(i*53+190)%360,c=(String(ten).trim().split(/\s+/).pop()||'?').slice(0,2).toUpperCase();return`<span class="av" style="background:hsl(${h} 55% 91%);color:hsl(${h} 55% 26%)">${esc(c)}</span>`}
const nhanhV=d=>`<svg width="${d?19:13}" height="11" viewBox="0 0 ${d?19:13} 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${d?'Đã đăng':'Đã tạo bài'}"><path d="M1.5 6l3.5 3.5L11.5 2${d?'M8.5 8.5l1 1L17.5 2':''}"/></svg>`;

/* ===== KẾT NỐI ===== */
async function api(action,payload={}){
  if(!API_URL)return demoApi(action,payload);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload,pin})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Có lỗi');
  return j.data;
}
async function chay(action,payload,thongBao){
  try{const d=await api(action,payload);if(d&&d.baiDang){db=d;ve()}if(thongBao)toast(thongBao);return d||true}
  catch(e){toast(e.message);return null}
}

function demoTai(){
  try{const c=nho.get('lichDangBaiDemo');if(c){const d=JSON.parse(c);if(d.chuDe){d.khungGio=d.khungGio||[];return d}}}catch(e){}
  const nv=[];for(let i=1;i<=12;i++)nv.push({id:'nv'+i,ten:'Nhân viên '+i,hoatDong:true});
  const cd=['Khuyến mãi trong tuần','Sản phẩm mới về','Mẹo dùng điện máy','Hoạt động siêu thị','Dịch vụ trả góp'].map((ten,i)=>({id:'cd'+i,ten,moTa:'',hoatDong:true}));
  const nh=['Nhóm mẫu 1','Nhóm mẫu 2','Nhóm mẫu 3'].map((ten,i)=>({id:'nh'+i,ten,link:'https://www.facebook.com/groups/',hoatDong:true}));
  const d={nhanVien:nv,baiDang:[],chuDe:cd,nhom:nh,dangNhom:[],khungGio:GIO_MAC_DINH.map((ten,i)=>({id:'kg'+i,ten,hoatDong:true}))},n=new Date(),dau=ymd(new Date(n.getFullYear(),n.getMonth(),1)),cuoi=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  d.baiDang=taoXoay(d,dau,cuoi,[1,2,3,4,5,6,0],GIO_MAC_DINH).map((b,i)=>({...macDinh(),...b,id:'d'+i}));
  demoLuu(d);return d;
}
const macDinh=()=>({id:'',ngay:'',gio:'',nvId:'',chuDe:'',noiDung:'',anhUrl:'',trangThai:'Chưa đăng',linkBai:'',ghiChu:'',tuDong:false,duyet:false,fbPostId:'',loi:'',capNhat:'',dangLuc:''});
function demoApi(a,p){
  const d=demoTai(),q=x=>d.baiDang.find(b=>b.id===x),xong=()=>(demoLuu(d),JSON.parse(JSON.stringify(d)));

function xao(ds){const a=ds.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function vongXoay(ds,truocId){
  let q=[],truoc=truocId;const no={};
  const lay=tranhId=>{
    if(!q.length){q=xao(ds).filter(x=>{if(no[x.id]){no[x.id]--;return false}return true});if(!q.length)q=xao(ds);if(q.length>1&&q[0].id===truoc)q.push(q.shift())}
    if(tranhId&&ds.length>1&&q.length===1&&q[0].id===tranhId)q.push(...xao(ds));
    let i=tranhId?q.findIndex(x=>x.id!==tranhId):0;if(i<0)i=0;
    const x=q.splice(i,1)[0];truoc=x.id;return x;
  };
  lay.traLai=x=>q.unshift(x);
  lay.tinLuot=id=>{const i=q.findIndex(x=>x.id===id);if(i>=0)q.splice(i,1);else no[id]=(no[id]||0)+1;truoc=id};
  return lay;
}
const textChuDe=c=>c?(c.ten+(c.moTa?'\n'+c.moTa:'')):'';
function taoXoay(d,tu,den,thu,gios){
  const dsNV=d.nhanVien.filter(n=>n.hoatDong),dsCD=(d.chuDe||[]).filter(c=>c.hoatDong);if(!dsNV.length)return[];
  const giu=d.baiDang.filter(x=>x.ngay>=tu&&x.ngay<=den&&(x.trangThai!=='Chưa đăng'||x.noiDung||x.tuDong));
  const truoc=d.baiDang.filter(x=>x.ngay<tu).sort(sapXep).pop();
  const layNV=vongXoay(dsNV,truoc&&truoc.nvId),layCD=dsCD.length?vongXoay(dsCD):null,cuoi={},kq=[];
  const c=new Date(tu+'T00:00:00'),het=new Date(den+'T00:00:00');
  for(;c<=het;c.setDate(c.getDate()+1)){
    if(!thu.includes(c.getDay()))continue;
    for(const gio of gios){
      const ngay=ymd(c);
      if(giu.some(x=>x.ngay===ngay&&x.gio===gio))continue;
      let nv=layNV();const cd=layCD?layCD(cuoi[nv.id]):null;
      const codinh=cd&&dsNV.find(n=>n.id===cd.nvCoDinh);
      if(codinh&&codinh.id!==nv.id){layNV.traLai(nv);nv=codinh;layNV.tinLuot(nv.id)}
      if(cd)cuoi[nv.id]=cd.id;
      kq.push({ngay,gio,nvId:nv.id,chuDe:textChuDe(cd),coDinh:!!codinh});
    }
  }
  return kq;
}

/* ===== THỐNG KÊ ===== */
function phutTre(){const v=parseInt(nho.get('phutTre'),10);return v>=0?v:30}
function doiPhutTre(v){nho.set('phutTre',String(Math.max(0,parseInt(v,10)||0)));ve()}
function xepLoai(b,now,phut){
  const han=thoiGian(b).getTime()+phut*60000;
  if(b.trangThai==='Đã đăng'){
    const luc=new Date(b.dangLuc||b.capNhat||(b.ngay+'T'+b.gio+':00')).getTime();
    return luc>han?{loai:'tre',phut:Math.round((luc-thoiGian(b).getTime())/60000)}:{loai:'dung'};
  }
  if(b.trangThai==='Lỗi')return{loai:'loi'};
  if(b.trangThai==='Đang đăng'||now<=han)return{loai:'cho'};
  return{loai:'khong'};
}
function doDai(p){return p>=60?Math.floor(p/60)+' giờ '+(p%60?p%60+' phút':''):p+' phút'}

  const vp=bai.filter(x=>x.loai==='tre'||x.loai==='khong'||x.loai==='loi').reverse();

  <div class="the"><h2>Theo nhân viên</h2>${hang.length?`<div class="cuon-bang"><table><tr><th>Nhân viên</th><th class="so-p">Giao</th><th class="so-p">Đúng giờ</th><th class="so-p">Trễ</th><th class="so-p">Không đăng</th><th class="so-p">Tỉ lệ</th></tr>${hang.map(h=>`<tr><td><div class="nguoi" style="margin:0">${avatar(h.n.id,h.n.ten)}<span>${esc(h.n.ten)}</span></div></td><td class="so-p">${h.giao}</td><td class="so-p">${h.a}</td><td class="so-p">${h.t}</td><td class="so-p">${h.k}</td><td class="so-p">${h.tl===null?'-':h.tl+'%'}</td></tr>`).join('')}</table></div>`:'<div class="trong">Tháng này chưa có lịch.</div>'}</div>

  <label>Thông tin thật về sản phẩm, giá, khuyến mãi<textarea id="mTT" style="min-height:64px"></textarea></label>
  <button class="nut rong" id="mLenh">Sao chép lệnh cho Claude</button></details>
  <label>Chọn ảnh từ máy<input type="file" id="mFile" accept="image/*"></label>
  <label>Link ảnh<input id="mAnh" value="${esc(b.anhUrl)}"></label>
  <label class="chon" style="margin-bottom:12px"><input type="checkbox" id="mTu" ${b.tuDong?'checked':''}>Tự đăng lên fanpage đúng giờ</label>
  <button class="nut rong" id="mTay" style="margin-bottom:12px">Tôi tự đăng trên Facebook</button>
  <div id="mTayKhoi" hidden><label>Link bài đã đăng<input id="mLink" type="url" placeholder="https://facebook.com/..."></label><label>Ghi chú<input id="mGC"></label><button class="nut chinh" id="mXong">Xác nhận đã đăng</button></div>`:`
  ${b.noiDung?`<div class="nd">${esc(b.noiDung)}</div><button class="nut" style="margin-bottom:10px" id="chepND">Sao chép nội dung</button>`:''}
  ${linkAnToan(b.anhUrl)?`<p style="margin:0 0 8px"><a href="${esc(b.anhUrl)}" target="_blank" rel="noopener">Xem ảnh</a></p>`:''}
  ${link?`<p style="margin:0 0 8px"><a href="${esc(link)}" target="_blank" rel="noopener">Mở bài đã đăng</a></p>`:''}
  ${cuaToi&&b.trangThai==='Đã đăng'?nhomTrongBai(b):''}
  ${!cuaToi&&tt(b)!=='xong'?`<p style="color:var(--mo);font-size:13px">Muốn tạo bài, hãy chọn đúng tên người đăng.</p>`:''}`}
  </div><div class="hop-cuoi">${sua?'<button class="nut chinh" id="mLuu">Lưu bài</button><button class="nut" id="mDang">Đăng ngay</button>':'<button class="nut" onclick="thuDong()">Đóng</button>'}</div></div></div>`;
  formGoc=giaTriForm();
  if($('chepND'))$('chepND').onclick=()=>chep(b.noiDung);
  if(cuaToi&&b.trangThai==='Đã đăng')ganNhom(b);
  if(!sua)return;
  const nvId=b.nvId,bd=()=>({id:b.id,nvId,noiDung:$('mND').value.trim(),anhUrl:$('mAnh').value.trim(),tuDong:$('mTu').checked});
  $('mLenh').onclick=()=>{const c=[b.chuDe,$('mTT').value.trim()].filter(Boolean).join('\n');if(!c)return toast('Nhập thông tin trước');chep(lenhClaude(c),'Đã sao chép. Dán vào Claude rồi chép bài về đây')};
  $('mFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;toast('Đang tải ảnh...');try{const base64=await nenAnh(f);const r=await chayNV('staffUpload',{id:b.id,nvId,base64,ten:f.name});if(r&&r.url){$('mAnh').value=r.url;toast('Đã tải ảnh. Bấm Lưu bài để giữ lại')}}catch(err){toast('Không đọc được ảnh này')}};
  $('mLuu').onclick=async()=>{const p=bd();if(!p.noiDung)return toast('Nhập nội dung bài');if(await chayNV('staffSave',p,p.tuDong?'Đã lưu, đến giờ sẽ tự đăng':'Đã lưu bài'))dong()};
  $('mDang').onclick=async()=>{const p=bd();if(!p.noiDung)return toast('Nhập nội dung bài');if(!confirm('Đăng ngay lên fanpage?'))return;if(await chayNV('staffPost',p,'Đã gửi lệnh đăng')){const m=db.baiDang.find(x=>x.id===b.id);moNhom={};moXem(m)}};
  $('mTay').onclick=()=>{$('mTayKhoi').hidden=false;$('mLink').focus()};
  $('mXong').onclick=async()=>{const lk=$('mLink').value.trim();if(lk&&!linkAnToan(lk))return toast('Link phải bắt đầu bằng https://');const p=bd();delete p.tuDong;if(await chayNV('markDone',{...p,linkBai:lk,ghiChu:$('mGC').value.trim()},'Đã xác nhận'))moXem(db.baiDang.find(x=>x.id===b.id))};
}
function moSua(b){
  const opt=db.nhanVien.map(n=>`<option value="${esc(n.id)}" ${n.id===b.nvId?'selected':''}>${esc(n.ten)}</option>`).join('');
  $('modal').innerHTML=`<div class="lop" onclick="if(event.target===this)thuDong()"><div class="hop"><div class="hop-dau"><h3>${b.id?'Sắp xếp bài':'Thêm bài'} ${b.id?nhan(b):''}</h3><button class="nut-x" aria-label="Đóng" onclick="thuDong()">×</button></div><div class="hop-than">
  ${b.loi?`<p class="nd" style="background:var(--do-nhat);color:#831c1e">${esc(b.loi)}</p>`:''}
  <div class="luoi2"><label>Ngày<input type="date" id="sNgay" value="${esc(b.ngay)}"></label><label>Giờ<input type="time" id="sGio" value="${esc(b.gio)}"></label><label>Người đăng<select id="sNV">${opt}</select></label><label>Trạng thái<select id="sTT">${[...new Set(['Chưa đăng','Đã đăng',b.trangThai||'Chưa đăng'])].map(t=>`<option ${t===b.trangThai?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <label>Chủ đề<textarea id="sCD" style="min-height:76px">${esc(b.chuDe)}</textarea></label>
  ${b.noiDung?`<p style="margin:0 0 4px;color:var(--mo);font-size:13px">Bài do nhân viên viết${b.tuDong?', đã hẹn tự đăng':''}</p><div class="nd">${esc(b.noiDung)}</div>`:''}
  ${linkAnToan(b.linkBai)?`<p style="margin:0 0 10px"><a href="${esc(b.linkBai)}" target="_blank" rel="noopener">Mở bài đã đăng</a></p>`:''}
  </div><div class="hop-cuoi"><button class="nut chinh" id="sLuu">Lưu</button>${b.id?`<button class="nut do" id="sXoa">Xóa</button>`:''}<button class="nut" onclick="thuDong()">Đóng</button></div></div></div>`;
  formGoc=giaTriForm();
  $('sLuu').onclick=async()=>{const p={id:b.id,ngay:$('sNgay').value,gio:$('sGio').value,nvId:$('sNV').value,chuDe:$('sCD').value.trim(),trangThai:$('sTT').value};if(!p.ngay||!p.gio||!p.nvId)return toast('Thiếu ngày, giờ hoặc người đăng');if(await chay('savePost',p,'Đã lưu'))dong()};
  if(b.id)$('sXoa').onclick=async()=>{if(confirm('Xóa bài này?')&&await chay('deletePost',{id:b.id},'Đã xóa'))dong()};
}
function nenAnh(f){return new Promise((ok,loi)=>{const u=URL.createObjectURL(f),i=new Image();i.onerror=loi;i.onload=()=>{const t=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*t);c.height=Math.round(i.height*t);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.88).split(',')[1])};i.src=u})}
function lenhClaude(chuDe){return`Bạn là người viết bài Facebook cho một siêu thị Điện Máy Xanh tại An Giang.
Viết 1 bài đăng fanpage bằng tiếng Việt, gần gũi, dễ đọc, dài 60-120 từ, có lời kêu gọi đến siêu thị.

Thông tin:
${chuDe}

Quy tắc bắt buộc:
- Chỉ dùng giá, khuyến mãi, thông số, thời hạn có trong phần Thông tin. Tuyệt đối không tự nghĩ thêm.
- Không so sánh hạ thấp đối thủ, không cam kết quá mức.
- Tối đa 3 emoji, 2-3 hashtag.
- Chỉ trả về nội dung bài, không giải thích.`}

/* ===== ĐĂNG TỰ ĐỘNG ===== */
function veTuDong(){
  if(canQL())return;
  const cho=db.baiDang.filter(b=>b.tuDong&&b.trangThai==='Chưa đăng').sort(sapXep);
  const loi=db.baiDang.filter(b=>b.trangThai==='Lỗi').sort(sapXep);
  const c=ketNoi||{fb:'',ai:false};
  $('noiDung').innerHTML=`
  <div class="so"><div><b style="font-size:16px">${c.fb?esc(c.fb):'Chưa kết nối'}</b><span>Fanpage</span></div><div><b>${cho.length}</b><span>Bài đang hẹn tự đăng</span></div><div><b style="color:${loi.length?'var(--do)':'inherit'}">${loi.length}</b><span>Bài lỗi</span></div></div>
  ${loi.length?`<div class="the"><h2>Bài lỗi</h2>${loi.map(b=>`<div class="dong" onclick="moBai('${esc(b.id)}')"><div><b>${thuNgay(b.ngay)}, ${esc(b.gio)}</b><small>${esc(tenNV(b.nvId))}: ${esc(b.loi)}</small></div>${nhan(b)}</div>`).join('')}</div>`:''}
  <div class="the"><h2>Bài đang hẹn tự đăng</h2>${cho.map(b=>`<div class="dong" onclick="moBai('${esc(b.id)}')"><div style="flex:1;min-width:0"><b>${thuNgay(b.ngay)}, ${esc(b.gio)}</b><small style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tenNV(b.nvId))}: ${esc(b.noiDung||'Chưa có nội dung')}</small></div>${nhan(b)}</div>`).join('')||'<div class="trong">Chưa có bài nào được hẹn.</div>'}</div>
  <div class="the"><h2>Kết nối Facebook</h2>
  <ol class="hd"><li>Vào developers.facebook.com, tạo ứng dụng, lấy App ID và App Secret.</li><li>Mở Graph API Explorer, chọn ứng dụng, thêm quyền pages_show_list, pages_read_engagement, pages_manage_posts, bấm Generate Access Token và chọn đúng fanpage.</li><li>Dán 3 thông tin vào đây, bấm Kết nối. Khóa được lưu ở Apps Script, không nằm trong web.</li><li>Trong trang ứng dụng, chuyển từ Development sang Live. Nếu chưa chuyển, chỉ người có vai trò trong ứng dụng mới thấy bài.</li></ol>
  <div class="luoi2" style="margin-top:10px"><label>App ID<input id="fbId" autocomplete="off"></label><label>App Secret<input id="fbSecret" type="password" autocomplete="off"></label><label>User Token<input id="fbToken" type="password" autocomplete="off"></label><label>ID trang (chỉ khi có nhiều trang)<input id="fbPage" autocomplete="off"></label></div>
  <button class="nut chinh" onclick="ketNoiFb(this)">Kết nối</button> <button class="nut" onclick="thuFb()">Kiểm tra</button></div>`;
  if(!ketNoi&&API_URL)layKetNoi();
}
async function layKetNoi(){try{ketNoi=await api('status');if(tab==='tu-dong')ve()}catch(e){}}
async function ketNoiFb(n){n.disabled=true;const r=await chay('fbConnect',{appId:$('fbId').value.trim(),appSecret:$('fbSecret').value.trim(),userToken:$('fbToken').value.trim(),pageId:$('fbPage').value.trim()});n.disabled=false;if(r&&r.pageName){toast('Đã kết nối: '+r.pageName);ketNoi={...(ketNoi||{}),fb:r.pageName};ve()}}
async function thuFb(){const r=await chay('testFb');if(r&&r.pageName)toast('Kết nối tốt: '+r.pageName)}

/* ===== BẮT ĐẦU ===== */
(async()=>{
  $('bangDemo').hidden=!!API_URL;
  $('noiDung').innerHTML='<div class="trong">Đang tải...</div>';
  try{db=await api('getData');ve()}catch(e){$('noiDung').innerHTML='<div class="the trong">Không tải được dữ liệu. Kiểm tra link Apps Script.</div>'}
  if(API_URL)setInterval(async()=>{if($('modal').innerHTML||tab==='phan-lich'||tab==='khai-bao'||tab==='dang-nhap')return;try{db=await api('getData');ve()}catch(e){}},60000);
})();
</script>
</body>
</html>
