<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công Việc Siêu Thị</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f2f4f7;--surface:#fff;--raised:#eef1f5;--active:#e6eaf0;
  --border:#e3e7ec;--rule:#eef0f3;--control:#cdd3db;
  --text:#0d1420;--muted:#5a6472;
  --ink:#141a24;--blue:#1668c7;--blue-pale:#e4effb;--yellow:#ffd400;
  --positive:#247b50;--negative:#c4242a;
  --pill-positive-bg:#dcfae5;--pill-positive-ink:#04250e;
  --pill-negative-bg:#ffedea;--pill-negative-ink:#831c1e;
  --tone-kem:#fff1d9;--tone-xanh:#dff5e8;--tone-vang:#fff6b8;--tone-do:#ffe3e0;
  --radius-card:8px;--radius-control:6px;
  --gap:12px;--control-height:36px;--fs-title:24px;--fs-section:16px;--fs-body:14px;--fs-small:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font:400 var(--fs-body)/20px "Be Vietnam Pro",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
h1,h2{margin:0}
.topbar{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{display:flex;align-items:center;gap:20px;max-width:1180px;height:56px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;white-space:nowrap}
.mark{display:block;flex:none}
.tabs{display:flex;align-self:stretch;gap:4px}
.tab{position:relative;padding:0 12px;white-space:nowrap;border:0;background:none;color:var(--muted);font-weight:500}
.tab[aria-current]{color:var(--text)}
.tab[aria-current]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--blue)}
.top-right{margin-left:auto}
#dbWrap iframe{display:block;width:100%;height:calc(100vh - 57px);border:0;background:#fff}
.canvas{max-width:1180px;margin:0 auto;padding:28px 24px 48px}
.title-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:16px}
.title-text{flex:1;min-width:240px}
h1{font-size:var(--fs-title);line-height:32px;font-weight:700;letter-spacing:-.02em}
.finding{margin:2px 0 0;color:var(--muted)}
.month{display:flex;align-items:center;gap:6px}
.store-sel{height:var(--control-height);max-width:260px;padding:0 8px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-height);padding:0 12px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-weight:500;white-space:nowrap;transition:background .12s,transform .08s}
.btn:hover{background:var(--raised)}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--yellow);background:var(--yellow);color:var(--ink);font-weight:700}
.btn.primary:hover{background:#f5c800}
.btn.icon{width:36px;padding:0;font-size:18px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.weeks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:var(--gap);overflow-x:auto;scrollbar-width:none}
.wk{min-width:112px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);text-align:left}
.wk b{display:block;font-weight:700}
.wk span{display:block;font-size:var(--fs-small);line-height:16px;color:var(--muted);white-space:nowrap}
.wk:hover{border-color:var(--control)}
.wk[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.wk[aria-pressed=true] span{color:#d5dae2}
.wk-state{display:flex!important;align-items:center;gap:4px}
.panel{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.panel-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:60px;padding:12px 16px}
.panel-head h2{font-size:var(--fs-section);line-height:24px;font-weight:700}
.panel-head .btn:last-child{margin-left:auto}
.pill{flex:none;padding:2px 9px;border-radius:999px;background:var(--pill-positive-bg);color:var(--pill-positive-ink);font-size:var(--fs-small);line-height:16px;font-weight:500;white-space:nowrap}
.pill.lock{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
.grid{min-width:900px;table-layout:fixed}
.grid col.name{width:136px}
.grid col.hrs{width:76px}
.grid td.hrs{padding:0 12px 0 4px;border-bottom:1px solid var(--rule);text-align:right;font-weight:500;white-space:nowrap}
.person .sub{display:none}
.ten-gon{display:none}
th{font-weight:500;color:var(--muted);font-size:var(--fs-small)}
.grid th{height:48px;padding:0 4px;border-bottom:1px solid var(--border);text-align:center;line-height:16px}
.grid th b{display:block;color:var(--text);font-size:var(--fs-body);line-height:20px;font-weight:500}
.grid th.today b{color:var(--blue);font-weight:700}
.grid th:first-child,.person{position:sticky;left:0;z-index:2;background:var(--surface)}
.grid th:first-child{text-align:left;padding-left:16px}
.person{padding:0 8px 0 16px;border-bottom:1px solid var(--rule);font-weight:500;overflow-wrap:anywhere}
.grid td.c{padding:3px;border-bottom:1px solid var(--rule)}
.cell{display:flex;flex-direction:column;justify-content:center;gap:5px;width:100%;height:54px;padding:0 7px;border:0;border-radius:var(--radius-control);background:transparent;transition:background .12s}
.cell .code{font-size:15px;line-height:18px;font-weight:500;text-align:center;white-space:nowrap}
.cell.none{color:var(--muted);background:var(--ground)}
.cell.none .code{font-weight:400}
.cell:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--blue)}
.t-kem{background:var(--tone-kem)}.t-xanh{background:var(--tone-xanh)}.t-vang{background:var(--tone-vang)}
.t-do{background:var(--tone-do);color:var(--pill-negative-ink)}
.t-trang{background:var(--blue-pale)}
.bar{display:flex;gap:2px;height:7px}
.bar i{display:block;border-radius:2px;background:rgba(13,20,32,.12)}
.bar i.on{background:var(--blue)}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;padding:0 16px 12px}
.dayb{min-width:0;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface);text-align:left}
.dayb b{display:block;font-weight:700;line-height:18px}
.dayb span{display:block;font-size:var(--fs-small);line-height:16px;color:var(--muted);white-space:nowrap}
.dayb[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.dayb[aria-pressed=true] span{color:#d5dae2}
.check-t th{height:36px;padding:0 16px;border-bottom:1px solid var(--border);text-align:left}
.check-t th.mid,.check-t td.mid{width:96px;padding:0;text-align:center}
.check-t td{height:48px;padding:0 16px;border-bottom:1px solid var(--rule)}
.check-t td.name{font-weight:500}
.tick{display:flex;align-items:center;justify-content:center;width:100%;height:47px;cursor:pointer}
.tick:hover{background:var(--blue-pale)}
.tick.off{cursor:default;background:none}
.tick input{width:24px;height:24px;margin:0;accent-color:var(--blue);cursor:inherit}
.sum th{height:36px;padding:0 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.sum th:first-child,.sum td:first-child{text-align:left}
.sticky-first th:first-child,.sticky-first td:first-child{position:sticky;left:0;background:var(--surface)}
.tk-box{margin-bottom:var(--gap)}
.bs{overflow:auto;max-height:calc(100vh - 210px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.bs table{width:auto;min-width:100%}
.bs th{position:sticky;top:0;z-index:2;height:38px;padding:0 10px;background:var(--ink);color:#fff;font-size:14px;text-align:left;white-space:nowrap}
.bs th.num{text-align:right}
.bs td{height:38px;padding:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface)}
.bs .stt{position:sticky;left:0;z-index:1;width:44px;min-width:44px;padding:0;background:var(--raised);color:var(--muted);text-align:center}
.bs th.stt{z-index:3;background:var(--ink);color:#fff}
.bs td input,.bs td select{display:block;width:100%;min-width:130px;height:37px;padding:0 10px;border:0;border-radius:0;background:transparent}
.bs td input.num{min-width:110px;text-align:right}
.bs td input:focus,.bs td select:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--blue-pale)}
.bs .bdel{width:38px;min-width:38px;text-align:center}
.bs .bdel button{width:100%;height:37px;border:0;background:none;color:var(--negative);font-size:18px}
.bs tfoot td{position:sticky;bottom:0;z-index:1;height:40px;padding:0 10px;background:var(--tone-vang);font-weight:700;text-align:right}
.bs tfoot td.stt{z-index:2;background:var(--tone-vang)}
.bs tfoot td:nth-child(2){text-align:left}
.col-row{display:flex;gap:6px;margin-top:6px}
.col-row input,.col-row select{height:40px;min-width:0;flex:1;padding:0 8px;border:1px solid var(--control);border-radius:var(--radius-control);background:#fff}
.col-row .x{flex:none;width:40px;height:40px;border:1px solid var(--control);border-radius:var(--radius-control);background:#fff;color:var(--negative)}
.opts{display:block;width:100%;height:40px;margin-top:6px;padding:0 8px;border:1px solid var(--control);border-radius:var(--radius-control)}
.cell.picked,.cell.picked:not(:disabled):hover{box-shadow:inset 0 0 0 3px var(--ink)}
.multi .person,.multi .grid th{cursor:pointer}
.multi-tip{padding:0 16px 10px;color:var(--muted);font-size:var(--fs-small)}
.multi-bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -6px 18px rgba(13,20,32,.12)}
.multi-bar b{margin-right:8px}
.multi-pad{height:72px}
.save-bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--ink);color:#fff}
.save-bar.cao{bottom:65px}
.save-bar b{margin-right:auto;max-width:560px}
.save-bar .btn{color:var(--ink)}
.save-pad{height:64px}
.ca-khac{margin-top:14px}
.ca-khac input{flex:1;min-width:0;height:40px;padding:0 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:#fff}
.ca-khac .btn{height:40px}
.ca-khac .field{margin-bottom:6px}
.ca-gio{min-height:16px;margin-top:4px;color:var(--muted);font-size:var(--fs-small);line-height:16px}
.panel-head .shot{margin-left:auto}
.panel-head .shot+.btn{margin-left:0}
.money-strip{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:var(--gap);overflow:hidden}
.money-strip div{padding:14px 16px;border-left:1px solid var(--rule)}
.money-strip div:first-child{border-left:0}
.money-strip span{display:block;color:var(--muted);font-size:var(--fs-small);line-height:16px}
.money-strip b{display:block;margin-top:4px;font-size:20px;line-height:28px;font-weight:700;white-space:nowrap}
.money-strip .lead b{font-size:26px;line-height:32px}
.money-strip .am b,.quy-t .am{color:var(--negative)}
.money-strip .thu{background:var(--tone-xanh)}.money-strip .thu b{color:#17663f}.money-strip .thu span{color:#2d5a43}
.money-strip .chi{background:var(--tone-do)}.money-strip .chi b{color:#a81f25}.money-strip .chi span{color:#7c3236}
.money-strip .lead{background:var(--blue)}.money-strip .lead span,.money-strip .lead b{color:#fff}
.money-strip .lead.am{background:var(--negative)}
.quy-box{border-top:3px solid #247b50}.quy-box.chi-mode{border-top-color:var(--negative)}
.seg button.seg-thu[aria-pressed=true]{background:#247b50}.seg button.seg-chi[aria-pressed=true]{background:var(--negative)}
.quy-t td.vao{color:#17663f;font-weight:500}.quy-t td.ra{color:#c4242a;font-weight:500}
.quy-t td.ton{color:var(--blue);font-weight:700}.quy-t td.ton.am{color:var(--negative)}
.quy-t tfoot td.vao,.quy-t tfoot td.ra,.quy-t tfoot td.ton{font-weight:700}
.quy-form{display:grid;grid-template-columns:auto 150px 1.4fr 150px 1fr auto;gap:10px;align-items:end;padding:0 16px 16px}
.quy-form .field input{margin-top:6px}
.seg{display:flex;padding:3px;border-radius:var(--radius-control);background:var(--raised)}
.seg button{height:34px;padding:0 16px;border:0;border-radius:4px;background:none;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{color:#fff}
.quy-t{min-width:680px}
.quy-t td small{display:block;margin-left:0;color:var(--muted);font-size:var(--fs-small);line-height:16px;font-weight:400}
.quy-t th:nth-child(2),.quy-t td:nth-child(2){text-align:left}
.quy-t .act{width:112px;white-space:nowrap}
.link{height:32px;padding:0 8px;border:0;background:none;color:var(--blue);font-weight:500}
.link.danger{color:var(--negative)}
.sum td{height:44px;padding:0 12px;border-bottom:1px solid var(--rule);text-align:right}
.sum td:first-child{font-weight:500}
.sum tfoot td{border-bottom:0;font-weight:700}
.sum .zero{color:var(--muted)}
.note{margin:0;padding:10px 16px 12px;color:var(--muted);font-size:var(--fs-small);line-height:16px}
.admin{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap);align-items:start}
.admin-body{padding:0 16px 16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{height:24px;color:var(--muted);font-size:var(--fs-small);line-height:24px;text-align:center}
.cal button{height:40px;border:0;border-radius:var(--radius-control);background:var(--ground)}
.cal button:hover{box-shadow:inset 0 0 0 2px var(--blue)}
.cal button[aria-pressed=true]{background:var(--blue);color:#fff;font-weight:700}
.field{display:block;font-weight:500}
.field input,.field textarea{display:block;width:100%;height:40px;margin-top:8px;padding:0 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:#fff;font-weight:400}
.field textarea{height:240px;padding:10px;resize:vertical}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1;min-width:0}
.inline .btn{height:40px}
.stack{display:grid;gap:16px}
.empty{margin:0 16px 16px;padding:18px 16px;border:1px dashed var(--control);border-radius:var(--radius-card);color:var(--muted);text-align:center}
.empty .btn{margin-top:10px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-bottom:var(--gap)}
.storeck{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}
.storeck input{width:22px;height:22px;margin:0;accent-color:var(--blue)}
.group td{height:34px;background:var(--raised);color:var(--muted);font-size:var(--fs-small);font-weight:500}
.sum small{margin-left:6px;color:var(--muted);font-weight:400}
.btn.danger{color:var(--negative)}
.lockline{padding:0 16px 12px;color:var(--pill-negative-ink);font-size:var(--fs-small)}
dialog{width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:20px;border:0;border-radius:var(--radius-card);color:var(--text);box-shadow:0 16px 40px rgba(13,20,32,.24)}
dialog::backdrop{background:rgba(13,20,32,.5)}
dialog h2{margin-bottom:14px;font-size:18px;line-height:24px;font-weight:700}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:2px solid transparent;border-radius:var(--radius-control);text-align:left}
.pick b{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:700}
.pick b small{color:var(--muted);font-size:var(--fs-small);font-weight:400}
.pick.t-do b small{color:inherit}
.pick:hover{border-color:var(--blue)}
.pick.on{border-color:var(--ink)}
.dlg-row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.code-row{display:flex;gap:6px;margin-top:6px}
.code-row input,.code-row select{height:40px;min-width:0;flex:1;padding:0 8px;border:1px solid var(--control);border-radius:var(--radius-control);background:#fff}
.code-row input.short{flex:.55}
.code-row input:disabled{background:var(--raised);color:var(--muted)}
.sub-title{margin:16px 0 2px;font-weight:700}
.sub-title:first-of-type{margin-top:0}
.code-row .h{flex:none;width:56px;color:var(--muted);font-size:var(--fs-small);line-height:40px;text-align:right;white-space:nowrap}
.del{flex:none;width:40px;height:40px;border:1px solid var(--control);border-radius:var(--radius-control);background:#fff;color:var(--negative)}
#toast{position:fixed;left:50%;bottom:20px;z-index:10;max-width:calc(100vw - 32px);transform:translateX(-50%);padding:10px 14px;border-radius:var(--radius-control);background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:900px){.columns,.admin{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.quy-form{grid-template-columns:1fr 1fr}.quy-form .wide{grid-column:1/-1}}
@media (max-width:640px){
  .money-strip{grid-template-columns:1fr 1fr}.money-strip div:nth-child(3){border-left:0}.money-strip div:nth-child(n+3){border-top:1px solid var(--rule)}
  .tabs{min-width:0;overflow-x:auto;scrollbar-width:none}
  .topbar-in{gap:6px;height:52px;padding:0 10px}
  #dbWrap iframe{height:calc(100vh - 53px)}
  .brand span{display:none}
  .tabs{gap:0}
  .tab{padding:0 4px;font-size:13px}.tab[aria-current]::after{left:4px;right:4px}
  #mgr{padding:0 8px;font-size:13px}
  .topbar-in .mark{display:none}
  .canvas{padding:18px 16px 32px}
  .title-text{flex-basis:100%}
  .finding{font-size:13px}
  .btn{height:44px}.btn.icon{width:44px}
  .month{width:100%}.month .label{flex:1}
  .store-sel{width:100%;max-width:none;height:44px}
  .tools .btn{flex:1}
  .weeks{grid-auto-columns:auto;margin:0 -16px 10px;padding:0 16px}
  .wk{min-width:104px}
  .grid{min-width:0}.grid col.name{width:72px}
  .grid-wrap{overflow:visible}
  .grid th{position:sticky;top:53px;z-index:3;background:var(--surface);padding:0 1px;font-size:11px}
  .grid th b{font-size:12px}
  .grid th:first-child{z-index:4}
  .grid td.c{padding:2px 1px}
  .cell{padding:0 2px}
  .cell .code{font-size:13px;line-height:14px;white-space:normal;overflow-wrap:anywhere}
  .ten-du{display:none}
  .ten-gon{display:block;font-size:13px;line-height:16px}
  .title-row{gap:8px}
  h1{font-size:20px;line-height:26px}
  .store-sel{flex:1 1 0;width:auto;min-width:0}
  .store-sel+.month{flex:none;width:auto}
  .month .label{flex:none;white-space:nowrap}
  .tab{min-width:44px}
  input:not([type=checkbox]),select,textarea{font-size:16px}
  .field input{height:44px}
  .code-row input,.code-row select{height:44px}
  .del,.inline .btn{height:44px}
  .del{width:44px}
  .link{height:44px}
  .seg button{height:44px}
  .cal button{height:44px}
  .grid col.hrs,.grid th.hrs,.grid td.hrs{display:none}
  .person .sub{display:block;color:var(--muted);font-size:11px;line-height:14px;font-weight:400;white-space:nowrap}
  .grid th:first-child{padding-left:8px;text-align:left}
  .person{padding:0 2px 0 8px}
  .panel{margin:0 -16px;border-width:1px 0;border-radius:0}
  .columns,.admin{gap:14px}
  .admin{margin-bottom:14px}
  .check-t th.mid,.check-t td.mid{width:76px}
  .sum th,.sum td{padding:0 8px}
  .sum th:first-child,.sum td:first-child{padding-left:16px}
  .sum th:last-child,.sum td:last-child{padding-right:16px}
}

<script>
/* LINK APPS SCRIPT DÙNG CHUNG VỚI LỊCH ĐĂNG BÀI */
const API_URL = "https://script.google.com/macros/s/AKfycbzaIm8pj8TKSzdbmXsbPXYGlsR8FgQ8FIfz9cYE_ibJPfS2ChvxVXjdoQiYy88GZWFV/exec";

const LOCAL_PASS = "1234";
const DAYS = ["Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7","CN"];
const COLORS = {trang:"Xanh dương",kem:"Cam nhạt",xanh:"Xanh lá",vang:"Vàng",do:"Đỏ"};
const BUOI = {S:"Sáng",C:"Chiều"};
const STORE_KEY = "lich_sieu_thi_v3";
const ST_KEY = "lich_sieu_thi_chon";
const $ = id => document.getElementById(id);

const state = {nhap:{},nhapSt:null,dangLuu:false,mobile:window.matchMedia("(max-width:640px)").matches,view:"nhom",day:null,me:"",multi:false,sel:new Set(),st:"",stores:[],units:[],tab:"ca",year:0,month:0,week:null,rsDay:null,employees:[],codes:[],cells:{},locks:{},
  quy:null,quyForm:null,bang:null,rsPlans:[],rsChecks:{},rsEmp:{},rsPlan:null,rsDraft:null,pw:null,active:null,pending:0,loadId:0,loaded:false,failed:false,after:null};

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dm(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function parse(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function ym(){return state.year+"-"+String(state.month+1).padStart(2,"0")}
function key(name,date){return name+"|"+date}
function dayName(x){return DAYS[(parse(x).getDay()+6)%7]}
function money(n){return Math.round(n).toLocaleString("vi-VN")+" đ"}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function btn(cls,text,fn){const b=el("button",cls,text);b.onclick=fn;return b}
function codeTone(ma){const c=state.codes.find(x=>x.ma===ma);return c?c.mau:"trang"}
function caOf(ma,units){
  const u=units||state.units,m=/^\d+/.exec(ma||"");
  if(!m)return [];
  const d=[...new Set(m[0])];
  return d.every(x=>u.some(y=>String(y.so)===x))?d:[];
}
function gioOf(ma,units){
  const u=units||state.units;
  return caOf(ma,u).reduce((a,x)=>a+Number(u.find(y=>String(y.so)===x).gio),0);
}
function fmtH(n){return (Math.round(n*10)/10).toLocaleString("vi-VN")}
function bar(ma){
  const on=caOf(ma),b=el("div","bar");
  state.units.forEach(r=>{const s=el("i",on.includes(String(r.so))?"on":"");s.style.flex=String(r.gio);b.append(s)});
  return b;
}
function weeks(){
  const last=new Date(state.year,state.month+1,0),out=[];
  for(let m=mondayOf(new Date(state.year,state.month,1));m<=last;m=addDays(m,7))out.push(m);
  return out;
}

let toastTimer;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3000)}

/* ---------- Lưu trên máy này (khi chưa dán link Apps Script) ---------- */
const GIO_MAC_DINH=[{so:"1",gio:1},{so:"2",gio:3},{so:"3",gio:3},{so:"4",gio:3},{so:"5",gio:2}];
const CA_MAC_DINH=[{ma:"123",mau:"trang"},{ma:"45",mau:"trang"},{ma:"2345",mau:"trang"},{ma:"12345",mau:"trang"},{ma:"OFF",mau:"do"}];
function seed(){return {stores:[],emp:{},data:{},codes:{},units:{},plans:[],checks:{}}}
function readStore(){
  let d=null;
  try{const s=localStorage.getItem(STORE_KEY);if(s)d=JSON.parse(s)}catch(e){}
  d=d||seed();
  if(Array.isArray(d.codes)){const goc=d.codes;d.codes={};d.stores.forEach(s=>d.codes[s.ma]=goc.map(c=>({...c})))}
  d.units=d.units||{};d.plans=d.plans||[];d.checks=d.checks||{};return d;
}
function writeStore(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d))}catch(e){throw new Error("Không lưu được trên máy này")}}
function bucket(d,st){return d.data[st]=d.data[st]||{cells:{},locks:{}}}
function localLoad(q){
  const d=readStore(),st=d.stores.some(s=>s.ma===q.st)?q.st:(d.stores[0]?d.stores[0].ma:"");
  const x=bucket(d,st),cells={},locks={},checks={},rsEmp={},plans=d.plans.filter(p=>p.month===q.month);
  Object.keys(x.cells).forEach(k=>{const dt=k.split("|")[1];if(dt>=q.from&&dt<=q.to)cells[k]=x.cells[k]});
  Object.keys(x.locks).forEach(k=>{if(k>=q.from&&k<=q.to)locks[k]=true});
  Object.keys(d.checks).forEach(k=>{if(plans.some(p=>p.id===k.split("|")[0]))checks[k]=true});
  d.stores.forEach(s=>rsEmp[s.ma]=d.emp[s.ma]||[]);
  return {st,stores:d.stores,employees:d.emp[st]||[],codes:d.codes[st]||[],units:d.units[st]||(st?GIO_MAC_DINH:[]),cells,locks,rsPlans:plans,rsChecks:checks,rsEmp};
}
function localPost(b){
  const d=readStore(),m=b.pw===LOCAL_PASS;
  if(b.action==="login"){if(!m)throw new Error("Sai mật khẩu");return {}}
  if(["setLock","saveStores","saveEmployees","saveCodes","rsSave","rsDelete","rsSetCost","rsSetLock"].includes(b.action)&&!m)throw new Error("Cần đăng nhập quản lý");
  const x=bucket(d,b.st),plan=d.plans.find(p=>p.id===b.id);
  if(b.action==="setCell"){
    if(!m&&x.locks[ymd(mondayOf(parse(b.date)))])throw new Error("Tuần này đã khóa");
    if(b.code)x.cells[key(b.name,b.date)]=b.code;else delete x.cells[key(b.name,b.date)];
  }
  if(b.action==="setCells"){
    if(!m&&b.cells.some(c=>x.locks[ymd(mondayOf(parse(c.date)))]))throw new Error("Tuần này đã khóa");
    b.cells.forEach(c=>{if(c.code)x.cells[key(c.name,c.date)]=c.code;else delete x.cells[key(c.name,c.date)]});
  }
  if(b.action==="setLock"){if(b.locked)x.locks[b.week]=true;else delete x.locks[b.week]}
  if(b.action==="saveStores"){
    d.stores=b.stores;
    b.stores.forEach(s=>{if(!(d.codes[s.ma]||[]).length)d.codes[s.ma]=CA_MAC_DINH.map(c=>({...c}))});
  }
  if(b.action==="saveEmployees")d.emp[b.st]=b.employees;
  if(b.action==="saveCodes"){d.codes[b.st]=b.codes;d.units[b.st]=b.units}
  if(b.action==="rsSave"){
    if(plan){plan.dates=b.dates;plan.stores=b.stores}
    else d.plans.push({id:b.id,month:b.month,cost:0,locked:false,dates:b.dates,stores:b.stores});
    Object.keys(d.checks).forEach(k=>{const a=k.split("|");if(a[0]===b.id&&!(b.dates.includes(a[1])&&b.stores.includes(a[2])))delete d.checks[k]});
  }
  if(b.action==="rsDelete"){
    d.plans=d.plans.filter(p=>p.id!==b.id);
    Object.keys(d.checks).forEach(k=>{if(k.startsWith(b.id+"|"))delete d.checks[k]});
  }
  if(b.action==="rsToggle"){
    if(!m&&plan.locked)throw new Error("Lịch chạy này đã khóa");
    const k=[b.id,b.date,b.tickSt,b.name,b.buoi].join("|");if(b.on)d.checks[k]=true;else delete d.checks[k];
  }
  if(b.action==="bangLoad"||b.action==="bangSave"||b.action==="bangDelete"||b.action==="bangCols"){
    if((b.action==="bangDelete"||b.action==="bangCols")&&!m)throw new Error("Cần đăng nhập quản lý");
    d.bang=d.bang||{};const x2=d.bang[b.st]=d.bang[b.st]||{cols:[],rows:[]};
    if(b.action==="bangLoad")return {cols:x2.cols,rows:x2.rows.filter(r=>r.month===b.month)};
    if(b.action==="bangCols")x2.cols=b.cols;
    if(b.action==="bangDelete")x2.rows=x2.rows.filter(r=>r.id!==b.id);
    if(b.action==="bangSave")b.rows.forEach(r=>{const o=x2.rows.find(y=>y.id===r.id);if(o)o.data=r.data;else x2.rows.push({id:r.id,month:b.month,data:r.data})});
    writeStore(d);return {};
  }
  if(b.action==="quyLoad"||b.action==="quySave"||b.action==="quyDelete"){
    if(b.action==="quyDelete"&&!m)throw new Error("Cần đăng nhập quản lý");
    const ds=d.quy=d.quy||[];
    if(b.action==="quyLoad"){
      const mine=ds.filter(r=>r.st===b.st);let tonDau=0;
      mine.forEach(r=>{if(r.ngay<b.month+"-01")tonDau+=r.loai==="Thu"?r.soTien:-r.soTien});
      return {tonDau,rows:mine.filter(r=>r.ngay.startsWith(b.month)).sort((x,y)=>x.ngay.localeCompare(y.ngay))};
    }
    d.quy=ds.filter(r=>r.id!==b.id);
    if(b.action==="quySave")d.quy.push({id:b.id,st:b.st,ngay:b.ngay,loai:b.loai,noiDung:b.noiDung,soTien:b.soTien,ghiChu:b.ghiChu});
  }
  if(b.action==="rsSetCost")plan.cost=b.cost;
  if(b.action==="rsSetLock")plan.locked=b.locked;
  writeStore(d);return {};
}

/* ---------- Kết nối ---------- */
async function apiLoad(q){
  if(!API_URL)return localLoad(q);
  const r=await fetch(API_URL+"?app=phanca&st="+encodeURIComponent(q.st)+"&from="+q.from+"&to="+q.to+"&month="+q.month);
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Lỗi tải dữ liệu");return j;
}
async function apiPost(body){
  body.pw=body.pw||state.pw;body.st=body.st||state.st;body.app="phanca";
  if(!API_URL)return localPost(body);
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Lỗi lưu dữ liệu");return j;
}
async function send(body,okMsg){
  state.pending++;
  try{const r=await apiPost(body);if(okMsg)toast(okMsg);return r||{}}
  catch(e){toast(/lock|fetch/i.test(e.message||"")?"Hệ thống đang bận, dữ liệu vẫn còn, hãy bấm Lưu lại":e.message||"Chưa lưu được, thử lại sau");return null}
  finally{state.pending--}
}
async function load(silent){
  const id=++state.loadId,w=weeks();
  try{
    const d=await apiLoad({st:state.st,from:ymd(w[0]),to:ymd(addDays(w[w.length-1],6)),month:ym()});
    if(id!==state.loadId||state.pending>0)return;
    rememberStore(d.st);
    Object.assign(state,{stores:d.stores,units:d.units,employees:d.employees,codes:d.codes,cells:d.cells,locks:d.locks,rsPlans:d.rsPlans,
      rsChecks:d.rsChecks,rsEmp:d.rsEmp,loaded:true,failed:false});
    apNhap();render();
  }catch(e){if(id===state.loadId&&!silent){state.failed=true;render()}}
}

function hoursWeek(name,mon){let n=0;for(let i=0;i<7;i++)n+=gioOf(state.cells[key(name,ymd(addDays(mon,i)))]);return n}
function monthDays(){const out=[],last=new Date(state.year,state.month+1,0).getDate();for(let d=1;d<=last;d++)out.push(new Date(state.year,state.month,d));return out}
function hoursMonth(name){return monthDays().reduce((a,d)=>a+gioOf(state.cells[key(name,ymd(d))]),0)}
function statRows(){
  return state.employees.map(n=>{
    const r={n,codes:{},days:0,gio:0,t7:0,cn:0,gioCt:0};
    monthDays().forEach(d=>{
      const code=state.cells[key(n,ymd(d))];if(!code)return;
      r.codes[code]=(r.codes[code]||0)+1;
      const g=gioOf(code);if(!g)return;
      r.days++;r.gio+=g;
      if(d.getDay()===6){r.t7++;r.gioCt+=g}
      if(d.getDay()===0){r.cn++;r.gioCt+=g}
    });
    r.ct=r.t7+r.cn;return r;
  });
}
function statTable(heads,rows,foot,sticky){
  const sc=el("div","table-scroll"),g=el("table","sum"+(sticky?" sticky-first":"")),th=el("thead"),hr=el("tr");
  heads.forEach(x=>hr.append(el("th","",x)));th.append(hr);g.append(th);
  const body=el("tbody"),put=(tr,v)=>tr.append(el("td",v===0||v==="0"?"zero":"",v));
  rows.forEach(r=>{const tr=el("tr");r.forEach(v=>put(tr,v));body.append(tr)});g.append(body);
  const tf=el("tfoot"),fr=el("tr");foot.forEach(v=>fr.append(el("td","",v)));tf.append(fr);g.append(tf);
  sc.append(g);return sc;
}

function storeName(ma){const s=state.stores.find(x=>x.ma===ma);return s?storeLabel(s):ma}
function sortedPlans(){return [...state.rsPlans].sort((a,b)=>(a.dates[0]||"").localeCompare(b.dates[0]||""))}
function planDays(p){return p.dates.length===1?dm(parse(p.dates[0])):dm(parse(p.dates[0]))+" – "+dm(parse(p.dates[p.dates.length-1]))}
function ckKey(p,date,st,n,b){return [p.id,date,st,n,b].join("|")}
function planPeople(p){
  const out=[];
  p.stores.forEach(st=>{
    const names=[...(state.rsEmp[st]||[])];
    Object.keys(state.rsChecks).forEach(k=>{const a=k.split("|");if(a[0]===p.id&&a[2]===st&&!names.includes(a[3]))names.push(a[3])});
    names.forEach(n=>out.push({st,n}));
  });
  return out;
}
function planRows(p){
  const rows=planPeople(p).map(({st,n})=>{
    let s=0,c=0;
    p.dates.forEach(x=>{if(state.rsChecks[ckKey(p,x,st,n,"S")])s++;if(state.rsChecks[ckKey(p,x,st,n,"C")])c++});
    return {st,n,s,c,t:s+c,money:0};
  });
  const tt=rows.reduce((a,r)=>a+r.t,0),per=tt?p.cost/tt:0;
  rows.forEach(r=>r.money=r.t*per);
  return {rows,per,cost:p.cost};
}

const CHUP={lib:null};

    dd.open();dd.write('<!doctype html><html lang="vi"><head><meta charset="utf-8">'+kieu+'<style>#chupGoc,#chupGoc *{letter-spacing:.01px!important;transition:none!important}</style></head><body style="margin:0;background:#fff"><div id="chupGoc" style="box-sizing:border-box;width:'+rong+'px;padding:20px;background:#fff"><div id="chupTen" style="margin-bottom:12px;font-size:20px;line-height:28px;font-weight:700"></div></div></body></html>');dd.close();

    ban.querySelectorAll(".no-shot").forEach(x=>x.remove());if(sua)sua(ban);
    await (dd.fonts?dd.fonts.ready:Promise.resolve());await new Promise(r=>setTimeout(r,150));
    const dt=goc.offsetWidth*goc.offsetHeight;let net=4;
    if(navigator.maxTouchPoints>0)while(net>2&&dt*net*net>16e6)net--;
    let blob=null;

async function toggleRs(p,date,st,name,buoi,on){
  const k=ckKey(p,date,st,name,buoi);
  if(on)state.rsChecks[k]=true;else delete state.rsChecks[k];
  render();
  const e=document.querySelector('input[data-k="'+CSS.escape(k)+'"]');if(e)e.focus();
  if(!await send({action:"rsToggle",id:p.id,date,tickSt:st,name,buoi,on})){if(on)delete state.rsChecks[k];else state.rsChecks[k]=true;render();load(true)}
}
async function saveCost(p){
  const cost=+$("rsCost").value.replace(/\D/g,"");
  if(await send({action:"rsSetCost",id:p.id,cost},"Đã lưu chi phí")){p.cost=cost;render()}
}
async function setRsLock(p,locked){
  if(await send({action:"rsSetLock",id:p.id,locked},locked?"Đã khóa lịch":"Đã mở khóa lịch")){p.locked=locked;render()}
}

/* ---------- Quản lý ---------- */
function needMgr(fn){
  if(state.pw){fn();return}
  state.after=fn;$("loginPass").value="";$("loginDlg").showModal();
}
async function login(e){
  e.preventDefault();
  const pw=$("loginPass").value;
  if(await send({action:"login",pw})){
    state.pw=pw;$("loginDlg").close();render();
    const fn=state.after;state.after=null;if(fn)fn();
  }
}
function addCodeRow(ma,mau){
  const r=el("div","code-row"),inp=el("input");inp.value=ma||"";inp.placeholder="VD: 123_TN";inp.setAttribute("aria-label","Mã ca");inp.oninput=refreshHours;
  const sel=el("select");sel.setAttribute("aria-label","Màu");
  Object.keys(COLORS).forEach(k=>{const o=el("option","",COLORS[k]);o.value=k;sel.append(o)});
  sel.value=mau||"trang";
  const del=btn("del","×",()=>r.remove());del.setAttribute("aria-label","Xóa mã");
  r.append(inp,sel,el("span","h"),del);$("cfgCodes").append(r);refreshHours();
}
function addUnitRow(so,gio){
  const r=el("div","code-row"),a=el("input"),b=el("input");
  a.value=so||"";a.placeholder="Số ca";a.inputMode="numeric";a.setAttribute("aria-label","Số ca");a.oninput=refreshHours;
  b.value=gio?String(gio).replace(".",","):"";b.placeholder="Số giờ";b.inputMode="decimal";b.setAttribute("aria-label","Số giờ công");b.oninput=refreshHours;
  const del=btn("del","×",()=>{r.remove();refreshHours()});del.setAttribute("aria-label","Xóa ca");
  r.append(a,b,del);$("cfgUnits").append(r);
}
function readUnits(){
  return [...document.querySelectorAll("#cfgUnits .code-row")].map(r=>{
    const i=r.querySelectorAll("input");return {so:i[0].value.trim(),gio:Number(i[1].value.trim().replace(",","."))};
  }).filter(u=>u.so||u.gio);
}
function refreshHours(){
  const u=readUnits().filter(x=>x.so&&x.gio>0);
  document.querySelectorAll("#cfgCodes .code-row").forEach(r=>{
    const g=gioOf(r.querySelector("input").value.trim(),u);r.querySelector(".h").textContent=g?fmtH(g)+" giờ":"–";
  });
}
function openStore(){$("cfgStores").textContent="";state.stores.forEach(s=>addStoreRow(s.ma,s.ten,true));if(!state.stores.length)addStoreRow();$("storeDlg").showModal()}
function addStoreRow(ma,ten,old){
  const r=el("div","code-row"),a=el("input","short"),b=el("input");
  a.value=ma||"";a.placeholder="Mã";a.disabled=!!old;a.setAttribute("aria-label","Mã siêu thị");
  b.value=ten||"";b.placeholder="Tên siêu thị";b.setAttribute("aria-label","Tên siêu thị");
  const del=btn("del","×",()=>{if(!old||confirm("Xóa siêu thị "+ma+"? Lịch của siêu thị này sẽ không còn hiện."))r.remove()});
  del.setAttribute("aria-label","Xóa siêu thị");
  r.append(a,b,del);$("cfgStores").append(r);
}
async function saveStore(){
  const seen=new Set(),stores=[];let bad=false;
  document.querySelectorAll("#cfgStores .code-row").forEach(r=>{
    const i=r.querySelectorAll("input"),ma=i[0].value.trim(),ten=i[1].value.trim();
    if(!ma&&!ten)return;
    if(!ma||seen.has(ma))bad=true;else{seen.add(ma);stores.push({ma,ten})}
  });
  if(bad){toast("Mỗi siêu thị cần một mã riêng");return}
  if(!stores.length){toast("Cần ít nhất 1 siêu thị");return}
  if(await send({action:"saveStores",stores},"Đã lưu siêu thị")){
    state.stores=stores;$("storeDlg").close();
    if(!stores.some(s=>s.ma===state.st))rememberStore(stores[0].ma);
    const w=state.week;resetData();state.week=w;render();load();
  }
}
function openEmp(){
  const s=state.stores.find(x=>x.ma===state.st);$("empTitle").textContent="Nhân viên "+(s?storeLabel(s):"");
  $("cfgEmp").value=state.employees.join("\n");$("empDlg").showModal();
}
async function saveEmp(){
  const employees=[...new Set($("cfgEmp").value.split("\n").map(s=>s.trim()).filter(Boolean))];
  if(!employees.length){toast("Cần ít nhất 1 nhân viên");return}
  if(await send({action:"saveEmployees",employees},"Đã lưu nhân viên")){state.employees=employees;$("empDlg").close();render()}
}
function openCode(){
  const s=state.stores.find(x=>x.ma===state.st);$("codeTitle").textContent="Ca của "+(s?storeLabel(s):"");
  $("cfgUnits").textContent="";state.units.forEach(u=>addUnitRow(u.so,u.gio));
  $("cfgCodes").textContent="";state.codes.forEach(c=>addCodeRow(c.ma,c.mau));$("codeDlg").showModal();
}
async function saveCode(){
  const seen=new Set(),codes=[];
  document.querySelectorAll("#cfgCodes .code-row").forEach(r=>{
    const ma=r.querySelector("input").value.trim();
    if(ma&&!seen.has(ma)){seen.add(ma);codes.push({ma,mau:r.querySelector("select").value})}
  });
  if(!codes.length){toast("Cần ít nhất 1 mã ca");return}
  const units=readUnits(),so=units.map(u=>u.so);
  if(!units.length||new Set(so).size<so.length||units.some(u=>!/^[1-9]$/.test(u.so)||!(u.gio>0))){toast("Mỗi ca cần một số riêng từ 1 đến 9 và số giờ lớn hơn 0");return}
  if(await send({action:"saveCodes",codes,units},"Đã lưu ca làm việc")){state.codes=codes;state.units=units;$("codeDlg").close();render()}
}

function nhapKey(){return "ca_nhap_"+state.st}
function nhapDoc(){try{state.nhap=JSON.parse(localStorage.getItem(nhapKey())||"{}")}catch(e){state.nhap={}}state.nhapSt=state.st}
function nhapGhi(){try{localStorage.setItem(nhapKey(),JSON.stringify(state.nhap))}catch(e){}}
function apNhap(){Object.keys(state.nhap).forEach(k=>{if(state.nhap[k])state.cells[k]=state.nhap[k];else delete state.cells[k]})}
function datNhap(k,code){state.nhap[k]=code;if(code)state.cells[k]=code;else delete state.cells[k];nhapGhi()}
async function luuCa(){
  if(state.dangLuu)return;
  const keys=Object.keys(state.nhap);if(!keys.length)return;
  state.dangLuu=true;render();
  let xong=0,loi=false;
  for(let i=0;i<keys.length&&!loi;i+=300){
    const nhom=keys.slice(i,i+300).map(k=>{const p=k.lastIndexOf("|");return {k,name:k.slice(0,p),date:k.slice(p+1),code:state.nhap[k]}});
    const r=await send({action:"setCells",cells:nhom.map(x=>({date:x.date,name:x.name,code:x.code}))});
    if(!r){loi=true;break}
    nhom.forEach(x=>{if(state.nhap[x.k]===x.code)delete state.nhap[x.k]});nhapGhi();xong+=nhom.length;
  }
  state.dangLuu=false;
  if(!loi){toast("Đã lưu "+xong+" ô");load(true)}
  render();
}
function huyCa(){
  if(!confirm("Bỏ các ca chưa lưu?"))return;
  state.nhap={};nhapGhi();load(true);
}
function veThanhLuu(v){
  const n=Object.keys(state.nhap).length;if(!n)return;
  const f=el("div","save-bar"+(state.multi?" cao":"")),l=btn("btn primary",state.dangLuu?"Đang lưu…":"Lưu",luuCa),h=btn("btn","Hủy",huyCa);
  l.disabled=h.disabled=state.dangLuu;
  f.append(el("b","","Chưa lưu "+n+" ô"),h,l);v.append(el("div","save-pad"),f);
}
function rememberStore(st){state.st=st;if(state.nhapSt!==st)nhapDoc();try{if(st)localStorage.setItem(ST_KEY,st)}catch(e){}}
function resetData(){
  state.sel.clear();
  Object.assign(state,{day:null,week:null,rsDay:null,rsPlan:null,rsDraft:null,employees:[],rsPlans:[],rsChecks:{},rsEmp:{},cells:{},locks:{},quy:null,quyForm:null,bang:null,loaded:false,failed:false});
}
function goMonth(n){
  bangLuu();
  const d=new Date(state.year,state.month+n,1);state.year=d.getFullYear();state.month=d.getMonth();
  resetData();render();load();if(state.tab==="quy")loadQuy();if(state.tab==="bang")loadBang();
}
function setStore(st){bangLuu();state.day=null;const w=state.week;rememberStore(st);resetData();state.week=w;render();load();if(state.tab==="quy")loadQuy();if(state.tab==="bang")loadBang()}
function setTab(t){bangLuu();state.multi=false;state.sel.clear();state.tab=t;if(t==="quy"){state.quy=null;render();loadQuy()}else if(t==="bang"){state.bang=null;render();loadBang()}else render();window.scrollTo(0,0)}

$("tabCa").onclick=()=>setTab("ca");
$("tabRs").onclick=()=>setTab("rs");
$("tabTk").onclick=()=>setTab("tk");
$("tabDb").onclick=()=>setTab("db");
$("tabQuy").onclick=()=>setTab("quy");
$("tabBang").onclick=()=>setTab("bang");
$("bangAddCol").onclick=()=>bangHangCot({});
$("bangClose").onclick=()=>$("bangDlg").close();
$("bangSaveCols").onclick=bangLuuCot;
window.addEventListener("beforeunload",e=>{if(bangBan.ids.size){bangLuu();e.preventDefault()}});
$("mgr").onclick=()=>{if(state.pw){state.pw=null;if(state.tab==="tk")state.tab="ca";render()}else needMgr(()=>{})};
$("loginForm").onsubmit=login;
$("closeLogin").onclick=()=>$("loginDlg").close();
$("closePick").onclick=()=>$("picker").close();
$("caKhac").oninput=caKhacGio;
$("caKhacForm").onsubmit=e=>{e.preventDefault();const v=$("caKhac").value.trim();if(!v){toast("Chưa nhập ca");return}choose(v)};
$("clearCell").onclick=()=>choose("");
$("closeEmp").onclick=()=>$("empDlg").close();
$("closeCode").onclick=()=>$("codeDlg").close();
$("addCode").onclick=()=>addCodeRow();
$("addUnit").onclick=()=>addUnitRow();
$("addStore").onclick=()=>addStoreRow();
$("closeStore").onclick=()=>$("storeDlg").close();
$("saveStore").onclick=saveStore;
$("saveEmp").onclick=saveEmp;
$("saveCode").onclick=saveCode;

/* Chủ Nhật mở sẵn tuần sau để nhân viên sắp ca */
(function start(){
  Object.assign(state,layView());
  window.matchMedia("(max-width:640px)").addEventListener("change",e=>{state.mobile=e.matches;render()});
  const now=new Date(),t=now.getDay()===0?addDays(mondayOf(now),7):mondayOf(now);
  try{state.st=localStorage.getItem(ST_KEY)||""}catch(e){}
  state.year=t.getFullYear();state.month=t.getMonth();state.week=ymd(t);
  render();load();
})();
/* Tự cập nhật mỗi 30 giây để thấy thay đổi của người khác */
if(API_URL)setInterval(()=>{
  const busy=state.sel.size||state.rsDraft||document.querySelector("dialog[open]")||document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="SELECT";
  if(!document.hidden&&!state.pending&&!busy&&state.tab!=="db"){if(state.tab==="quy")loadQuy();else if(state.tab==="bang"){if(!bangBan.ids.size)loadBang()}else load(true)}
},30000);
</script>
