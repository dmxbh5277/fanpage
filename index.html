<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch Đăng Bài</title>
<style>
:root{--nen:#f3f5f8;--the:#fff;--chu:#17202e;--mo:#657083;--vien:#dfe4ec;--chinh:#1557b0;--chinh-nhat:#e8f0fc;--xanh:#16794a;--xanh-nhat:#e2f4ea;--do:#c62f2f;--do-nhat:#fdeaea;--cam:#a85b00;--cam-nhat:#fff2dc;--xam-nhat:#eef1f5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--chinh);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header select{max-width:210px;border:0;border-radius:7px;padding:6px 8px;color:var(--chu)}
nav{background:var(--the);border-bottom:1px solid var(--vien);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 15px;white-space:nowrap;cursor:pointer;color:var(--mo);border-bottom:3px solid transparent;font-weight:600}
nav button.on{color:var(--chinh);border-color:var(--chinh)}
main{max-width:1120px;margin:auto;padding:14px 16px 48px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:10px;padding:14px;margin-bottom:14px}
.the h2{font-size:16px;margin:0 0 10px}
.demo{background:var(--cam-nhat);color:var(--cam);padding:8px 16px;font-size:13px;text-align:center}
.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gian{justify-content:space-between}
.nut{border:1px solid var(--vien);background:var(--the);border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:600;min-height:38px}
.nut:hover{border-color:var(--chinh)}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.do{color:var(--do);border-color:#efc3c3}
.nut:disabled{opacity:.55;cursor:wait}
label{display:block;font-size:13px;color:var(--mo);font-weight:600;margin-bottom:10px}
label input:not([type=checkbox]),label select,label textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--vien);border-radius:7px;background:#fff;color:var(--chu);font-weight:400;font-size:15px}
textarea{min-height:120px;resize:vertical}
label.chon{display:flex;gap:7px;align-items:center;color:var(--chu);margin:0 12px 8px 0;font-weight:500;font-size:14px}
.luoi2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.so{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.so div{background:var(--the);border:1px solid var(--vien);border-radius:10px;padding:10px 12px}
.so b{display:block;font-size:22px}
.so span{font-size:13px;color:var(--mo)}
.thang{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--vien);border:1px solid var(--vien);border-radius:8px;overflow:hidden}
.tieude{background:var(--xam-nhat);text-align:center;font-size:13px;font-weight:700;padding:6px;color:var(--mo)}
.ngay{background:var(--the);min-height:104px;padding:5px;min-width:0}
.ngay.ngoai{background:#f8f9fb}
.ngay .so-ngay{font-size:13px;font-weight:700;color:var(--mo);margin-bottom:3px}
.ngay.homnay .so-ngay{color:#fff;background:var(--chinh);display:inline-block;padding:0 7px;border-radius:9px}
.chip{display:block;width:100%;border:0;border-radius:5px;padding:3px 5px;margin-bottom:3px;font-size:12px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-cho{background:var(--chinh-nhat);color:var(--chinh)}.s-xong{background:var(--xanh-nhat);color:var(--xanh)}.s-tre{background:var(--do-nhat);color:var(--do)}.s-loi{background:var(--do);color:#fff}.s-dang{background:var(--cam-nhat);color:var(--cam)}
.nhan{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700}
.dong{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--vien);cursor:pointer}
.dong:first-of-type{border-top:0}
.dong small{color:var(--mo);display:block}
.trong{color:var(--mo);padding:14px 0;text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-top:1px solid var(--vien);text-align:left;font-size:14px}
th{color:var(--mo);font-size:13px;border-top:0}
td.so-p,th.so-p{text-align:right}
.thanh{height:7px;background:var(--xam-nhat);border-radius:4px;min-width:60px;overflow:hidden}
.thanh i{display:block;height:100%;background:var(--xanh)}
.lop{position:fixed;inset:0;background:rgba(14,20,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;overflow:auto;z-index:20}
.hop{background:var(--the);border-radius:12px;padding:16px;width:100%;max-width:560px}
.hop h3{margin:0 0 10px;font-size:17px}
.nd{white-space:pre-wrap;background:var(--xam-nhat);border-radius:7px;padding:10px;font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2636;color:#fff;padding:9px 15px;border-radius:8px;z-index:30;max-width:92vw;display:none}
ol.hd{margin:0;padding-left:20px;font-size:14px}ol.hd li{margin-bottom:6px}
a{color:var(--chinh)}
@media(max-width:680px){
 .thang{display:block;border:0;background:none}
 .tieude,.ngay.ngoai,.ngay.rong{display:none}
 .ngay{min-height:0;border:1px solid var(--vien);border-radius:8px;margin-bottom:7px;padding:8px}
 .chip{font-size:14px;padding:7px 8px}
}
</style>
</head>
<body>
<header><h1>Lịch Đăng Bài</h1><select id="chonNV" aria-label="Chọn tên nhân viên"></select></header>
<div id="bangDemo" class="demo" hidden>Bản chạy thử: dữ liệu chỉ lưu trên máy này, chưa dùng chung. Mã quản lý thử: 1234</div>
<nav id="tabs"></nav>
<main id="noiDung"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* DÁN LINK WEB APP CỦA APPS SCRIPT VÀO GIỮA HAI DẤU NHÁY */
const API_URL = 'https://script.google.com/macros/s/AKfycbzaIm8pj8TKSzdbmXsbPXYGlsR8FgQ8FIfz9cYE_ibJPfS2ChvxVXjdoQiYy88GZWFV/exec';

const TEN_THU=['T2','T3','T4','T5','T6','T7','CN'];
const TT_NHAN={cho:'Chưa đăng',xong:'Đã đăng',tre:'Trễ',loi:'Lỗi',dang:'Đang đăng'};
let db={nhanVien:[],baiDang:[]}, tab='lich', pin='', ketNoi=null;
let thang=new Date(); thang.setDate(1);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nho={get(k){try{return localStorage.getItem(k)}catch(e){return nho.m[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){nho.m[k]=v}},m:{}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dmy=s=>s?s.split('-').reverse().join('/'):'';
const homNay=()=>ymd(new Date());
const tenNV=id=>(db.nhanVien.find(n=>n.id===id)||{}).ten||'Chưa phân';
const thoiGian=b=>new Date(b.ngay+'T'+(b.gio||'00:00')+':00');
const sapXep=(a,b)=>(a.ngay+a.gio).localeCompare(b.ngay+b.gio);
const linkAnToan=u=>/^https?:\/\//i.test(u||'')?u:'';
function tt(b){if(b.trangThai==='Đã đăng')return'xong';if(b.trangThai==='Lỗi')return'loi';if(b.trangThai==='Đang đăng')return'dang';return thoiGian(b)<new Date()?'tre':'cho'}
const nhan=b=>`<span class="nhan s-${tt(b)}">${TT_NHAN[tt(b)]}</span>`;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)}
async function chep(t,thongBao){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast(thongBao||'Đã sao chép')}

/* ===== KẾT NỐI ===== */
async function api(action,payload={}){
  if(!API_URL)return demoApi(action,payload);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload,pin})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Có lỗi');
  return j.data;
}
async function chay(action,payload,thongBao){
  try{const d=await api(action,payload);if(d&&d.baiDang){db=d;ve()}if(thongBao)toast(thongBao);return d||true}
  catch(e){toast(e.message);return null}
}

/* ===== CHẾ ĐỘ CHẠY THỬ ===== */
function demoLuu(d){nho.set('lichDangBaiDemo',JSON.stringify(d))}
function demoTai(){
  try{const c=nho.get('lichDangBaiDemo');if(c)return JSON.parse(c)}catch(e){}
  const nv=[];for(let i=1;i<=12;i++)nv.push({id:'nv'+i,ten:'Nhân viên '+i,hoatDong:true});
  const d={nhanVien:nv,baiDang:[]},n=new Date(),dau=ymd(new Date(n.getFullYear(),n.getMonth(),1)),cuoi=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  d.baiDang=taoXoay(d,dau,cuoi,[1,2,3,4,5,6,0],['09:00']).map((b,i)=>({...macDinh(),...b,id:'d'+i}));
  demoLuu(d);return d;
}
const macDinh=()=>({id:'',ngay:'',gio:'',nvId:'',chuDe:'',noiDung:'',anhUrl:'',trangThai:'Chưa đăng',linkBai:'',ghiChu:'',tuDong:false,duyet:false,fbPostId:'',loi:'',capNhat:''});
function demoApi(a,p){
  const d=demoTai(),q=x=>d.baiDang.find(b=>b.id===x),xong=()=>(demoLuu(d),JSON.parse(JSON.stringify(d)));
  if(a==='getData')return xong();
  if(a==='markDone'){const b=q(p.id);if(b.nvId!==p.nvId)throw new Error('Bài này không phân cho nhân viên đã chọn');Object.assign(b,{trangThai:'Đã đăng',linkBai:p.linkBai||'',ghiChu:p.ghiChu||b.ghiChu,capNhat:new Date().toISOString().slice(0,19)});return xong()}
  if(pin!=='1234')throw new Error('Sai mã quản lý');
  switch(a){
    case'login':return true;
    case'status':return{fb:'',ai:false};
    case'savePost':{let b=q(p.id);if(!b){b={...macDinh(),id:'d'+Date.now()};d.baiDang.push(b)}Object.assign(b,p);return xong()}
    case'deletePost':d.baiDang=d.baiDang.filter(b=>b.id!==p.id);return xong();
    case'replaceRange':d.baiDang=d.baiDang.filter(x=>!(x.ngay>=p.from&&x.ngay<=p.to)||x.trangThai!=='Chưa đăng'||x.noiDung||x.tuDong);p.posts.forEach((b,i)=>d.baiDang.push({...macDinh(),...b,id:'d'+Date.now()+i}));return xong();
    case'saveStaff':d.nhanVien=p.nhanVien.map((n,i)=>({...n,id:n.id||'nv'+Date.now()+i}));return xong();
    case'aiWrite':throw new Error('Bản chạy thử chưa nối Claude. Hãy dùng nút Sao chép lệnh cho Claude.');
    case'postNow':{const b=q(p.id);Object.assign(b,{trangThai:'Đã đăng',linkBai:'',ghiChu:'Chạy thử, chưa đăng thật'});return xong()}
    default:throw new Error('Bản chạy thử chưa hỗ trợ việc này');
  }
}

/* ===== XOAY LỊCH ===== */
function taoXoay(d,tu,den,thu,gios){
  const dsNV=d.nhanVien.filter(n=>n.hoatDong);if(!dsNV.length)return[];
  const giu=d.baiDang.filter(x=>x.ngay>=tu&&x.ngay<=den&&(x.trangThai!=='Chưa đăng'||x.noiDung||x.tuDong));
  const truoc=d.baiDang.filter(x=>x.ngay<tu).sort(sapXep).pop();
  let i=truoc?dsNV.findIndex(n=>n.id===truoc.nvId)+1:0;const kq=[];
  const c=new Date(tu+'T00:00:00'),het=new Date(den+'T00:00:00');
  for(;c<=het;c.setDate(c.getDate()+1)){
    if(!thu.includes(c.getDay()))continue;
    for(const gio of gios){
      const ngay=ymd(c);
      if(giu.some(x=>x.ngay===ngay&&x.gio===gio))continue;
      kq.push({ngay,gio,nvId:dsNV[i%dsNV.length].id});i++;
    }
  }
  return kq;
}

/* ===== KHUNG ===== */
function veTabs(){
  const ds=[['lich','Lịch'],['cua-toi','Bài của tôi'],['thong-ke','Thống kê'],['xoay','Xoay lịch'],['nv','Nhân viên'],['tu-dong','Đăng tự động']];
  $('tabs').innerHTML=ds.map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="doiTab('${k}')">${t}</button>`).join('');
}
function veChonNV(){
  const v=nho.get('nvChon')||'';
  $('chonNV').innerHTML='<option value="">Chọn tên của bạn</option>'+db.nhanVien.filter(n=>n.hoatDong).map(n=>`<option value="${esc(n.id)}" ${n.id===v?'selected':''}>${esc(n.ten)}</option>`).join('');
}
$('chonNV').onchange=e=>{nho.set('nvChon',e.target.value);ve()};
function doiTab(k){tab=k;ve()}
function ve(){
  veTabs();veChonNV();
  const m={lich:veLich,'cua-toi':veCuaToi,'thong-ke':veThongKe,xoay:veXoay,nv:veNV,'tu-dong':veTuDong}[tab];
  m();
}
function canQL(){
  if(pin)return false;
  $('noiDung').innerHTML=`<div class="the" style="max-width:360px;margin:auto"><h2>Dành cho quản lý</h2><label>Mã quản lý<input id="oPin" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')dangNhap()"></label><button class="nut chinh" onclick="dangNhap()">Vào</button></div>`;
  return true;
}
async function dangNhap(){const c=pin;pin=$('oPin').value;try{await api('login');ve()}catch(e){pin=c;toast(e.message)}}

/* ===== LỊCH ===== */
function veLich(){
  const n=homNay(),homnay=db.baiDang.filter(b=>b.ngay===n).sort(sapXep);
  const treDs=db.baiDang.filter(b=>tt(b)==='tre');
  const y=thang.getFullYear(),mo=thang.getMonth(),dau=new Date(y,mo,1),lui=(dau.getDay()+6)%7;
  const o=[];
  for(let i=0;i<42;i++){
    const d=new Date(y,mo,1-lui+i);
    if(i>=35&&d.getMonth()!==mo)break;
    const k=ymd(d),bai=db.baiDang.filter(b=>b.ngay===k).sort(sapXep),ngoai=d.getMonth()!==mo;
    o.push(`<div class="ngay ${ngoai?'ngoai':''} ${k===n?'homnay':''} ${bai.length?'':'rong'}"><div class="so-ngay">${TEN_THU[(d.getDay()+6)%7]} ${d.getDate()}</div>${bai.map(b=>`<button class="chip s-${tt(b)}" onclick="moBai('${esc(b.id)}')" title="${esc(tenNV(b.nvId))}">${esc(b.gio)} ${esc(tenNV(b.nvId))}</button>`).join('')}</div>`);
  }
  $('noiDung').innerHTML=`
  <div class="so"><div><b>${homnay.length}</b><span>Bài hôm nay</span></div><div><b>${homnay.filter(b=>tt(b)==='xong').length}</b><span>Hôm nay đã đăng</span></div><div><b style="color:${treDs.length?'var(--do)':'inherit'}">${treDs.length}</b><span>Đang trễ</span></div></div>
  <div class="the"><div class="hang gian" style="margin-bottom:10px">
    <div class="hang"><button class="nut" onclick="doiThang(-1)" aria-label="Tháng trước">‹</button><b>Tháng ${mo+1}/${y}</b><button class="nut" onclick="doiThang(1)" aria-label="Tháng sau">›</button></div>
    <div class="hang"><button class="nut" onclick="chepTuan()">Sao chép lịch 7 ngày</button>${pin?`<button class="nut chinh" onclick="moBai()">Thêm bài</button>`:''}</div></div>
  <div class="thang">${TEN_THU.map(t=>`<div class="tieude">${t}</div>`).join('')}${o.join('')}</div></div>`;
}
function doiThang(n){thang.setMonth(thang.getMonth()+n);ve()}
function chepTuan(){
  const tu=new Date(),ds=[];const den=new Date();den.setDate(den.getDate()+6);
  db.baiDang.filter(b=>b.ngay>=ymd(tu)&&b.ngay<=ymd(den)).sort(sapXep).forEach(b=>ds.push(`${dmy(b.ngay).slice(0,5)} ${b.gio}: ${tenNV(b.nvId)}${b.chuDe?' - '+b.chuDe:''}`));
  if(!ds.length)return toast('7 ngày tới chưa có lịch');
  chep('LỊCH ĐĂNG BÀI 7 NGÀY TỚI\n'+ds.join('\n'),'Đã sao chép, dán vào nhóm Zalo là xong');
}

/* ===== BÀI CỦA TÔI ===== */
function dongBai(b){return`<div class="dong" onclick="moBai('${esc(b.id)}')"><div><b>${dmy(b.ngay)} ${esc(b.gio)}</b><small>${esc(b.chuDe||'Chưa có chủ đề')}</small></div>${nhan(b)}</div>`}
function veCuaToi(){
  const v=$('chonNV').value;
  if(!v){$('noiDung').innerHTML='<div class="the trong">Chọn tên của bạn ở góc trên.</div>';return}
  const ds=db.baiDang.filter(b=>b.nvId===v).sort(sapXep);
  const con=ds.filter(b=>tt(b)!=='xong'),xong=ds.filter(b=>tt(b)==='xong').reverse().slice(0,10);
  $('noiDung').innerHTML=`<div class="the"><h2>Cần đăng (${con.length})</h2>${con.map(dongBai).join('')||'<div class="trong">Không còn bài nào.</div>'}</div><div class="the"><h2>Đã đăng gần đây</h2>${xong.map(dongBai).join('')||'<div class="trong">Chưa có.</div>'}</div>`;
}

/* ===== THỐNG KÊ ===== */
function veThongKe(){
  const p=y=>ymd(new Date(thang.getFullYear(),thang.getMonth()+y,y?0:1));
  const tu=p(0),den=p(1),bai=db.baiDang.filter(b=>b.ngay>=tu&&b.ngay<=den);
  const hang=db.nhanVien.map(n=>{const d=bai.filter(b=>b.nvId===n.id),x=d.filter(b=>tt(b)==='xong').length,t=d.filter(b=>['tre','loi'].includes(tt(b))).length,den2=x+t;return{n,tong:d.length,x,t,tl:den2?Math.round(x/den2*100):null}}).filter(h=>h.tong).sort((a,b)=>(b.tl??-1)-(a.tl??-1));
  const x=bai.filter(b=>tt(b)==='xong').length,t=bai.filter(b=>['tre','loi'].includes(tt(b))).length;
  $('noiDung').innerHTML=`<div class="hang" style="margin-bottom:12px"><button class="nut" onclick="doiThang(-1)" aria-label="Tháng trước">‹</button><b>Tháng ${thang.getMonth()+1}/${thang.getFullYear()}</b><button class="nut" onclick="doiThang(1)" aria-label="Tháng sau">›</button></div>
  <div class="so"><div><b>${bai.length}</b><span>Bài trong tháng</span></div><div><b>${x}</b><span>Đã đăng</span></div><div><b>${t}</b><span>Trễ hoặc lỗi</span></div><div><b>${x+t?Math.round(x/(x+t)*100)+'%':'-'}</b><span>Tỉ lệ hoàn thành đến nay</span></div></div>
  <div class="the"><h2>Theo nhân viên</h2>${hang.length?`<table><tr><th>Nhân viên</th><th class="so-p">Giao</th><th class="so-p">Đăng</th><th class="so-p">Trễ</th><th class="so-p">Tỉ lệ</th><th></th></tr>${hang.map(h=>`<tr><td>${esc(h.n.ten)}</td><td class="so-p">${h.tong}</td><td class="so-p">${h.x}</td><td class="so-p">${h.t}</td><td class="so-p">${h.tl===null?'-':h.tl+'%'}</td><td><div class="thanh"><i style="width:${h.tl||0}%"></i></div></td></tr>`).join('')}</table>`:'<div class="trong">Tháng này chưa có lịch.</div>'}</div>`;
}

/* ===== XOAY LỊCH ===== */
function veXoay(){
  if(canQL())return;
  const n=new Date(),dau=ymd(n),cuoi=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  const thu=[[1,'T2'],[2,'T3'],[3,'T4'],[4,'T5'],[5,'T6'],[6,'T7'],[0,'CN']];
  $('noiDung').innerHTML=`<div class="the"><h2>Xoay lịch tự động</h2>
  <div class="luoi2"><label>Từ ngày<input type="date" id="xTu" value="${dau}"></label><label>Đến ngày<input type="date" id="xDen" value="${cuoi}"></label><label>Giờ đăng (nhiều giờ cách nhau dấu phẩy)<input id="xGio" value="09:00"></label></div>
  <div class="hang">${thu.map(([v,t])=>`<label class="chon"><input type="checkbox" class="xThu" value="${v}" checked>${t}</label>`).join('')}</div>
  <button class="nut chinh" onclick="xemXoay()">Xem trước</button><div id="xKq" style="margin-top:12px"></div></div>`;
}
let banXoay=null;
function xemXoay(){
  const tu=$('xTu').value,den=$('xDen').value,gios=$('xGio').value.split(',').map(s=>s.trim()).filter(Boolean);
  const thu=[...document.querySelectorAll('.xThu:checked')].map(c=>+c.value);
  if(!tu||!den||tu>den)return toast('Kiểm tra lại khoảng ngày');
  if(!thu.length)return toast('Chọn ít nhất 1 thứ');
  if(!gios.every(g=>/^([01]\d|2[0-3]):[0-5]\d$/.test(g)))return toast('Giờ phải dạng 09:00');
  const ds=taoXoay(db,tu,den,thu,gios.slice().sort());
  if(!ds.length)return toast('Không tạo được lịch. Kiểm tra nhân viên đang hoạt động.');
  banXoay={from:tu,to:den,posts:ds};
  const dem={};ds.forEach(b=>dem[b.nvId]=(dem[b.nvId]||0)+1);
  $('xKq').innerHTML=`<p>Tạo <b>${ds.length}</b> lượt, ${Object.keys(dem).length} nhân viên, mỗi người ${Math.min(...Object.values(dem))}${Math.min(...Object.values(dem))!==Math.max(...Object.values(dem))?'–'+Math.max(...Object.values(dem)):''} lượt. Bài đã đăng hoặc đã có nội dung được giữ nguyên.</p>
  <table><tr><th>Ngày</th><th>Giờ</th><th>Nhân viên</th></tr>${ds.slice(0,8).map(b=>`<tr><td>${dmy(b.ngay)}</td><td>${b.gio}</td><td>${esc(tenNV(b.nvId))}</td></tr>`).join('')}</table>
  ${ds.length>8?`<p style="color:var(--mo);font-size:13px">... và ${ds.length-8} lượt nữa</p>`:''}<button class="nut chinh" onclick="luuXoay(this)">Lưu lịch này</button>`;
}
async function luuXoay(n){n.disabled=true;const r=await chay('replaceRange',banXoay,'Đã tạo lịch');if(r){tab='lich';ve()}else n.disabled=false}

/* ===== NHÂN VIÊN ===== */
function veNV(){
  if(canQL())return;
  $('noiDung').innerHTML=`<div class="the"><h2>Danh sách nhân viên</h2><p style="color:var(--mo);font-size:13px;margin-top:0">Bỏ tick với người nghỉ dài ngày, xoay lịch sẽ bỏ qua người đó.</p><div id="dsNV">${db.nhanVien.map(hangNV).join('')}</div><div class="hang"><button class="nut" onclick="$('dsNV').insertAdjacentHTML('beforeend',hangNV({id:'',ten:'',hoatDong:true}))">Thêm người</button><button class="nut chinh" onclick="luuNV()">Lưu</button></div></div>`;
}
function hangNV(n){return`<div class="hang hnv" data-id="${esc(n.id)}" style="margin-bottom:8px;flex-wrap:nowrap"><input class="tnv" value="${esc(n.ten)}" placeholder="Tên nhân viên" aria-label="Tên nhân viên" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--vien);border-radius:7px"><label class="chon" style="margin:0"><input type="checkbox" class="cnv" ${n.hoatDong?'checked':''}>Hoạt động</label></div>`}
function luuNV(){
  const ds=[...document.querySelectorAll('.hnv')].map(h=>({id:h.dataset.id,ten:h.querySelector('.tnv').value.trim(),hoatDong:h.querySelector('.cnv').checked})).filter(n=>n.ten);
  chay('saveStaff',{nhanVien:ds},'Đã lưu nhân viên');
}

/* ===== CHI TIẾT BÀI ===== */
function dong(){$('modal').innerHTML=''}
function moBai(id){
  const b=id?db.baiDang.find(x=>x.id===id):{...macDinh(),ngay:homNay(),gio:'09:00'};
  if(!b)return;
  pin?moSua(b):moXem(b);
}
function moXem(b){
  const cuaToi=$('chonNV').value===b.nvId,link=linkAnToan(b.linkBai);
  $('modal').innerHTML=`<div class="lop" onclick="if(event.target===this)dong()"><div class="hop"><h3>${dmy(b.ngay)} ${esc(b.gio)} ${nhan(b)}</h3>
  <p style="margin:0 0 8px">Người đăng: <b>${esc(tenNV(b.nvId))}</b></p>
  ${b.chuDe?`<p style="margin:0 0 8px">Chủ đề: ${esc(b.chuDe)}</p>`:''}
  ${b.noiDung?`<div class="nd">${esc(b.noiDung)}</div><button class="nut" style="margin-bottom:10px" id="chepND">Sao chép nội dung</button>`:''}
  ${linkAnToan(b.anhUrl)?`<p style="margin:0 0 8px"><a href="${esc(b.anhUrl)}" target="_blank" rel="noopener">Xem ảnh</a></p>`:''}
  ${link?`<p style="margin:0 0 8px"><a href="${esc(link)}" target="_blank" rel="noopener">Mở bài đã đăng</a></p>`:''}
  ${cuaToi&&tt(b)!=='xong'?`<label>Link bài đã đăng<input id="mLink" type="url" placeholder="https://facebook.com/..."></label><label>Ghi chú<input id="mGC"></label><button class="nut chinh" onclick="baoXong('${esc(b.id)}')">Xác nhận đã đăng</button>`:''}
  ${!cuaToi&&tt(b)!=='xong'?`<p style="color:var(--mo);font-size:13px">Muốn xác nhận, hãy chọn đúng tên người đăng ở góc trên.</p>`:''}
  <button class="nut" onclick="dong()" style="margin-left:6px">Đóng</button></div></div>`;
  if($('chepND'))$('chepND').onclick=()=>chep(b.noiDung);
}
async function baoXong(id){
  const link=$('mLink').value.trim();
  if(link&&!linkAnToan(link))return toast('Link phải bắt đầu bằng https://');
  if(await chay('markDone',{id,nvId:$('chonNV').value,linkBai:link,ghiChu:$('mGC').value.trim()},'Đã xác nhận'))dong();
}
function moSua(b){
  const opt=db.nhanVien.map(n=>`<option value="${esc(n.id)}" ${n.id===b.nvId?'selected':''}>${esc(n.ten)}</option>`).join('');
  $('modal').innerHTML=`<div class="lop" onclick="if(event.target===this)dong()"><div class="hop"><h3>${b.id?'Sửa bài':'Thêm bài'} ${b.id?nhan(b):''}</h3>
  ${b.loi?`<p class="nd" style="background:var(--do-nhat);color:var(--do)">${esc(b.loi)}</p>`:''}
  <div class="luoi2"><label>Ngày<input type="date" id="sNgay" value="${esc(b.ngay)}"></label><label>Giờ<input type="time" id="sGio" value="${esc(b.gio)}"></label><label>Người đăng<select id="sNV">${opt}</select></label><label>Trạng thái<select id="sTT">${[...new Set(['Chưa đăng','Đã đăng',b.trangThai||'Chưa đăng'])].map(t=>`<option ${t===b.trangThai?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <label>Chủ đề và thông tin thật về sản phẩm, giá, khuyến mãi<textarea id="sCD" style="min-height:76px">${esc(b.chuDe)}</textarea></label>
  <div class="hang" style="margin-bottom:10px"><button class="nut" id="sChepLenh">Sao chép lệnh cho Claude</button><button class="nut" id="sAI">Claude viết bài</button></div>
  <label>Nội dung bài<textarea id="sND">${esc(b.noiDung)}</textarea></label>
  <label>Link ảnh (link công khai, mở trực tiếp ra ảnh)<input id="sAnh" value="${esc(b.anhUrl)}"></label>
  <label>Link bài đã đăng<input id="sLink" value="${esc(b.linkBai)}"></label>
  <div class="hang"><label class="chon"><input type="checkbox" id="sTu" ${b.tuDong?'checked':''}>Tự đăng lên fanpage</label><label class="chon"><input type="checkbox" id="sDuyet" ${b.duyet?'checked':''}>Quản lý đã duyệt</label></div>
  <div class="hang"><button class="nut chinh" id="sLuu">Lưu</button>${b.id?`<button class="nut" id="sDang">Đăng ngay</button><button class="nut do" id="sXoa">Xóa</button>`:''}<button class="nut" onclick="dong()">Đóng</button></div></div></div>`;
  const lay=()=>({id:b.id,ngay:$('sNgay').value,gio:$('sGio').value,nvId:$('sNV').value,chuDe:$('sCD').value.trim(),noiDung:$('sND').value.trim(),anhUrl:$('sAnh').value.trim(),linkBai:$('sLink').value.trim(),trangThai:$('sTT').value,tuDong:$('sTu').checked,duyet:$('sDuyet').checked});
  $('sChepLenh').onclick=()=>{const c=$('sCD').value.trim();if(!c)return toast('Nhập chủ đề trước');chep(lenhClaude(c),'Đã sao chép. Dán vào Claude rồi chép bài về đây')};
  $('sAI').onclick=async e=>{const c=$('sCD').value.trim();if(!c)return toast('Nhập chủ đề trước');e.target.disabled=true;const r=await chay('aiWrite',{prompt:lenhClaude(c)});e.target.disabled=false;if(r&&r.text){$('sND').value=r.text;$('sDuyet').checked=false;toast('Đã viết xong. Đọc lại rồi mới duyệt')}};
  $('sLuu').onclick=async()=>{const p=lay();if(!p.ngay||!p.gio||!p.nvId)return toast('Thiếu ngày, giờ hoặc người đăng');if(p.tuDong&&p.duyet&&!p.noiDung)return toast('Bài tự đăng cần có nội dung');if(await chay('savePost',p,'Đã lưu'))dong()};
  if(b.id){
    $('sXoa').onclick=async()=>{if(confirm('Xóa bài này?')&&await chay('deletePost',{id:b.id},'Đã xóa'))dong()};
    $('sDang').onclick=async()=>{const p=lay();if(!p.noiDung)return toast('Bài chưa có nội dung');if(!confirm('Đăng ngay lên fanpage?'))return;if(!await chay('savePost',p))return;if(await chay('postNow',{id:b.id},'Đã gửi lệnh đăng'))dong()};
  }
}
function lenhClaude(chuDe){return`Bạn là người viết bài Facebook cho một siêu thị Điện Máy Xanh tại An Giang.
Viết 1 bài đăng fanpage bằng tiếng Việt, gần gũi, dễ đọc, dài 60-120 từ, có lời kêu gọi đến siêu thị.

Thông tin:
${chuDe}

Quy tắc bắt buộc:
- Chỉ dùng giá, khuyến mãi, thông số, thời hạn có trong phần Thông tin. Tuyệt đối không tự nghĩ thêm.
- Không so sánh hạ thấp đối thủ, không cam kết quá mức.
- Tối đa 3 emoji, 2-3 hashtag.
- Chỉ trả về nội dung bài, không giải thích.`}

/* ===== ĐĂNG TỰ ĐỘNG ===== */
function veTuDong(){
  if(canQL())return;
  const cho=db.baiDang.filter(b=>b.tuDong&&b.trangThai==='Chưa đăng').sort(sapXep);
  const loi=db.baiDang.filter(b=>b.trangThai==='Lỗi').sort(sapXep);
  const c=ketNoi||{fb:'',ai:false};
  $('noiDung').innerHTML=`
  <div class="so"><div><b style="font-size:16px">${c.fb?esc(c.fb):'Chưa kết nối'}</b><span>Fanpage</span></div><div><b style="font-size:16px">${c.ai?'Đã kết nối':'Chưa kết nối'}</b><span>Claude API (không bắt buộc)</span></div><div><b>${cho.filter(b=>!b.duyet).length}</b><span>Bài chờ duyệt</span></div></div>
  ${loi.length?`<div class="the"><h2>Bài lỗi</h2>${loi.map(b=>`<div class="dong" onclick="moBai('${esc(b.id)}')"><div><b>${dmy(b.ngay)} ${esc(b.gio)}</b><small>${esc(b.loi)}</small></div>${nhan(b)}</div>`).join('')}</div>`:''}
  <div class="the"><h2>Hàng đợi tự đăng</h2>${cho.map(b=>`<div class="dong"><div onclick="moBai('${esc(b.id)}')" style="flex:1;min-width:0"><b>${dmy(b.ngay)} ${esc(b.gio)}</b><small style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.noiDung||'Chưa có nội dung')}</small></div>${b.duyet?'<span class="nhan s-xong">Đã duyệt</span>':(b.noiDung?`<button class="nut" onclick="duyet('${esc(b.id)}')">Duyệt</button>`:'<span class="nhan s-tre">Thiếu bài</span>')}</div>`).join('')||'<div class="trong">Chưa có bài. Mở một bài trong Lịch và tick Tự đăng lên fanpage.</div>'}</div>
  <div class="the"><h2>Kết nối Facebook</h2>
  <ol class="hd"><li>Vào developers.facebook.com, tạo ứng dụng, lấy App ID và App Secret.</li><li>Mở Graph API Explorer, chọn ứng dụng, thêm quyền pages_show_list, pages_read_engagement, pages_manage_posts, bấm Generate Access Token và chọn đúng fanpage.</li><li>Dán 3 thông tin vào đây, bấm Kết nối. Khóa được lưu ở Apps Script, không nằm trong web.</li><li>Trong trang ứng dụng, chuyển từ Development sang Live. Nếu chưa chuyển, chỉ người có vai trò trong ứng dụng mới thấy bài.</li></ol>
  <div class="luoi2" style="margin-top:10px"><label>App ID<input id="fbId" autocomplete="off"></label><label>App Secret<input id="fbSecret" type="password" autocomplete="off"></label><label>User Token<input id="fbToken" type="password" autocomplete="off"></label><label>ID trang (chỉ khi có nhiều trang)<input id="fbPage" autocomplete="off"></label></div>
  <button class="nut chinh" onclick="ketNoiFb(this)">Kết nối</button> <button class="nut" onclick="thuFb()">Kiểm tra</button></div>
  <div class="the"><h2>Kết nối Claude API (không bắt buộc)</h2><p style="font-size:14px;margin-top:0">Không kết nối vẫn dùng được: bấm Sao chép lệnh cho Claude, dán vào Claude, chép bài về. Kết nối API chỉ để viết bài ngay trong web, trả phí riêng theo lượt dùng.</p><label>Khóa API từ platform.claude.com<input id="aiKey" type="password" autocomplete="off"></label><button class="nut chinh" onclick="luuAi(this)">Lưu và kiểm tra</button></div>`;
  if(!ketNoi&&API_URL)layKetNoi();
}
async function layKetNoi(){try{ketNoi=await api('status');if(tab==='tu-dong')ve()}catch(e){}}
function duyet(id){const b=db.baiDang.find(x=>x.id===id);chay('savePost',{id,duyet:true,ngay:b.ngay,gio:b.gio,nvId:b.nvId},'Đã duyệt, đến giờ sẽ tự đăng')}
async function ketNoiFb(n){n.disabled=true;const r=await chay('fbConnect',{appId:$('fbId').value.trim(),appSecret:$('fbSecret').value.trim(),userToken:$('fbToken').value.trim(),pageId:$('fbPage').value.trim()});n.disabled=false;if(r&&r.pageName){toast('Đã kết nối: '+r.pageName);ketNoi={...(ketNoi||{}),fb:r.pageName};ve()}}
async function thuFb(){const r=await chay('testFb');if(r&&r.pageName)toast('Kết nối tốt: '+r.pageName)}
async function luuAi(n){n.disabled=true;const r=await chay('saveAiKey',{key:$('aiKey').value});n.disabled=false;if(r){toast('Claude đã kết nối');ketNoi={...(ketNoi||{}),ai:true};ve()}}

/* ===== BẮT ĐẦU ===== */
(async()=>{
  $('bangDemo').hidden=!!API_URL;
  $('noiDung').innerHTML='<div class="trong">Đang tải...</div>';
  try{db=await api('getData');ve()}catch(e){$('noiDung').innerHTML='<div class="the trong">Không tải được dữ liệu. Kiểm tra link Apps Script.</div>'}
  if(API_URL)setInterval(async()=>{if($('modal').innerHTML||tab==='xoay'||tab==='nv')return;try{db=await api('getData');ve()}catch(e){}},60000);
})();
</script>
</body>
</html>
